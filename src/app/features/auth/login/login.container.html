<main class="login" data-testid="login-page">
  <div class="login__header">
    <h1 class="login__brand">
      <org-logo size="lg" />
    </h1>
    <p class="login__subtitle">Acesse ou crie sua conta para continuar</p>
  </div>

  <org-surface variant="card" class="login__card">
    <div class="login__card-content">
      @if (errorMessage(); as error) {
        <div class="login__error" role="alert" data-testid="login-error-alert">
          <org-icon name="error" color="currentColor" />
          {{ error }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="login__form" id="login-form">
        <!-- Validation messages wait for the field to be touched, so a fresh page shows none. -->
        <org-text-field
          class="login__form-field"
          label="E-mail"
          type="email"
          placeholder="seu@email.com"
          testId="login-email-input"
          formControlName="email"
          [error]="
            !form.controls.email.touched
              ? ''
              : form.controls.email.hasError('required')
                ? 'E-mail é obrigatório'
                : form.controls.email.hasError('valueObject')
                  ? 'Digite um e-mail válido'
                  : ''
          "
        />

        <org-text-field
          class="login__form-field"
          label="Senha"
          type="password"
          placeholder="Sua senha"
          testId="login-password-input"
          formControlName="password"
          [passwordVisible]="!hidePassword()"
          (togglePasswordVisibility)="hidePassword.set(!hidePassword())"
          [error]="
            !form.controls.password.touched
              ? ''
              : form.controls.password.hasError('required')
                ? 'Senha é obrigatória'
                : form.controls.password.hasError('minlength')
                  ? 'Mínimo 6 caracteres'
                  : ''
          "
        />

        <org-button
          type="submit"
          class="login__submit-btn"
          data-testid="login-submit-btn"
          label="Entrar"
          [disabled]="form.invalid || loading()"
          [loading]="loading()"
          [fullWidth]="true"
        />
      </form>

      <div class="login__divider">
        <span class="login__divider-text">ou</span>
      </div>

      <org-button
        [disabled]="loading()"
        class="login__google-btn"
        data-testid="google-login-btn"
        label="Entrar com Google"
        variant="secondary"
        [fullWidth]="true"
        imageSrc="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        (pressed)="loginWithGoogle()"
      />
    </div>
  </org-surface>
</main>
