name: CD Pipeline - Production Deploy

on:
  workflow_run:
    workflows: ['CI Pipeline']
    types: [completed]
    branches: [main]

jobs:
  deploy-production:
    name: Deploy to Production (Firebase Hosting & Firestore)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Paths Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        if: steps.filter.outputs.code == 'true'
        run: npm ci

      # The push relay goes first: the app learns its address (*.workers.dev) from this deploy.
      # A failure here never stops the app's deploy; the app then hides "Ativar notificações".
      - name: Deploy Push Relay (Cloudflare Worker)
        id: push
        if: steps.filter.outputs.code == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        working-directory: push-worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "::warning::Push relay not deployed: CLOUDFLARE_WORKER_TOKEN or PUSH_VAPID_PRIVATE_KEY is missing."
            exit 0
          fi
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          npm ci
          npx wrangler deploy | tee deploy.log
          node -e 'console.log(JSON.stringify({ VAPID_PRIVATE_KEY: process.env.VAPID_PRIVATE_KEY, FIREBASE_API_KEY: process.env.FIREBASE_API_KEY }))' | npx wrangler secret bulk
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # The Organiza AI relay (ai-worker/): stateless, Gemini then Groq. GEMINI_API_KEY is the
      # app's own key (the PR reviews use GEMINI_PR_REVIEWS_API_KEY, another AI Studio project).
      # Without any provider key it is not deployed and the app hides the assistant.
      - name: Deploy AI Relay (Cloudflare Worker)
        id: ai
        if: steps.filter.outputs.code == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        working-directory: ai-worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || { [ -z "$GEMINI_API_KEY" ] && [ -z "$GROQ_API_KEY" ]; }; then
            echo "::warning::AI relay not deployed: CLOUDFLARE_WORKER_TOKEN, or both GEMINI and GROQ keys, are missing."
            exit 0
          fi
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          npm ci
          npx wrangler deploy | tee deploy.log
          node -e 'const s = {}; for (const k of ["GEMINI_API_KEY", "GROQ_API_KEY"]) if (process.env[k]) s[k] = process.env[k]; console.log(JSON.stringify(s))' | npx wrangler secret bulk
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Generate Runtime Config
        if: steps.filter.outputs.code == 'true'
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          PUSH_URL: ${{ steps.push.outputs.url }}
          AI_URL: ${{ steps.ai.outputs.url }}
        run: |
          cat <<EOF > public/runtime-config.js
          globalThis.__organizaAiRuntimeConfig = {
            firebase: {
              apiKey: '${FIREBASE_API_KEY}',
            },
            push: {
              url: '${PUSH_URL}',
            },
            ai: {
              url: '${AI_URL}',
            },
          };
          EOF

      - name: Build Application
        if: steps.filter.outputs.code == 'true'
        run: npm run build

      - name: Deploy Firestore Rules & Indexes
        if: steps.filter.outputs.code == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORGANIZA_AI_3416F }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json npx firebase-tools deploy --only firestore --project organiza-ai-3416f
          rm -f /tmp/sa.json

      - name: Deploy to Firebase Hosting (Live Channel)
        if: steps.filter.outputs.code == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORGANIZA_AI_3416F }}
          channelId: live
          projectId: organiza-ai-3416f
          target: organizaai
