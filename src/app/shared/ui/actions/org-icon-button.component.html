<button
  mat-icon-button
  class="org-icon-button__control"
  [class.org-icon-button__control--default]="tone() === 'default'"
  [class.org-icon-button__control--danger]="tone() === 'danger'"
  [class.org-icon-button__control--primary]="tone() === 'primary'"
  [class.org-icon-button__control--gradient]="gradient()"
  [attr.aria-label]="ariaLabel()"
  [attr.data-testid]="testId() || null"
  [matTooltip]="tooltipText()"
  [matTooltipDisabled]="!tooltipText()"
  [disabled]="isDisabled()"
  type="button"
  (click)="activate($event)"
>
  <org-icon [name]="icon()" color="currentColor" />
</button>
