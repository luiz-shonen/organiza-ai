<svg viewBox="0 0 600 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="partyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D94" />
      <stop offset="50%" stop-color="#FF8C42" />
      <stop offset="100%" stop-color="#FFC837" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#FF8C42" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    /* Estilos base do traço (Doodle) */
    .doodle {
      stroke: #2D3436;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 1. O Pulo do Calendário */
    .calendar-icon {
      transform-origin: 145px 80px;
      animation: iconBounce 5s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
    }

    @keyframes iconBounce {
      0%, 27% { transform: scale(1) translateY(0); }
      30% { transform: scale(1.08) translateY(-7px); }
      38%, 95% { transform: scale(1) translateY(0); }
      100% { transform: scale(1) translateY(0); }
    }

    /* 2. O Checkmark Sendo Desenhado */
    .check {
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      filter: url(#glow);
      animation: drawCheck 5s ease-out infinite;
    }

    @keyframes drawCheck {
      0%, 15% { stroke-dashoffset: 80; opacity: 1; }
      30%, 85% { stroke-dashoffset: 0; opacity: 1; }
      90%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* 3. A Chuva de Confetes Volumosa e Multidirecional */
    .confetti {
      opacity: 0;
      transform-origin: 145px 80px;
      animation: confettiRain 5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }

    .confetti-alt {
      opacity: 0;
      transform-origin: 300px 80px;
      animation: confettiRainAlt 5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }

    @keyframes confettiRain {
      0%, 25% {
        opacity: 0;
        transform: translate(0, 0) scale(0) rotate(0deg);
      }
      28% {
        opacity: 1;
        transform: translate(var(--bx), var(--by)) scale(1.2) rotate(var(--r1));
      }
      78% {
        opacity: 1;
        transform: translate(var(--fx), var(--fy)) scale(1) rotate(var(--r2));
      }
      88%, 100% {
        opacity: 0;
        transform: translate(var(--fx), calc(var(--fy) + 35px)) scale(0) rotate(var(--r2));
      }
    }

    @keyframes confettiRainAlt {
      0%, 28% {
        opacity: 0;
        transform: translate(0, 0) scale(0) rotate(0deg);
      }
      32% {
        opacity: 1;
        transform: translate(var(--bx), var(--by)) scale(1.3) rotate(var(--r1));
      }
      82% {
        opacity: 1;
        transform: translate(var(--fx), var(--fy)) scale(0.9) rotate(var(--r2));
      }
      92%, 100% {
        opacity: 0;
        transform: translate(var(--fx), calc(var(--fy) + 45px)) scale(0) rotate(var(--r2));
      }
    }

    /* Texto da Logo Totalmente em Degradê */
    .brand-text {
      font-family: 'Plus Jakarta Sans', 'Poppins', system-ui, sans-serif;
      font-weight: 800;
      font-size: 58px;
      letter-spacing: -1.8px;
      fill: url(#partyGradient);
    }
  </style>

  <!-- Calendário Posicionado Mais Próximo do Texto -->
  <g class="calendar-icon" transform="translate(65, 0)">
    <rect x="30" y="30" width="100" height="110" rx="12" fill="#FFFFFF" class="doodle" />
    <path d="M30,70 L130,70 L130,42 C130,35.37 124.63,30 118,30 L42,30 C35.37,30 30,35.37 30,42 Z" fill="#FF4D94" class="doodle"/>
    
    <rect x="50" y="20" width="8" height="20" rx="4" fill="#2D3436" />
    <rect x="102" y="20" width="8" height="20" rx="4" fill="#2D3436" />

    <g stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" fill="none">
      <rect x="45" y="85" width="20" height="20" rx="4" />
      <rect x="70" y="85" width="20" height="20" rx="4" stroke="#2D3436" stroke-dasharray="3 3"/>
      <rect x="95" y="85" width="20" height="20" rx="4" />
      <rect x="45" y="110" width="20" height="20" rx="4" />
      <rect x="70" y="110" width="20" height="20" rx="4" />
      <rect x="95" y="110" width="20" height="20" rx="4" />
    </g>

    <path class="check" d="M 65,95 L 75,105 L 105,75" fill="none" stroke="url(#partyGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Texto Organiza AI com Espaçamento Ajustado -->
  <text x="212" y="106" text-anchor="start" class="brand-text">
    Organiza AI
  </text>

  <!-- Lote 1: Confetes na Esquerda -->
  <circle class="confetti" cx="145" cy="80" r="5" fill="#FF4D94" style="--bx: -60px; --by: -50px; --fx: -95px; --fy: 20px; --r1: 45deg; --r2: 120deg;" />
  <rect class="confetti" x="140" y="75" width="8" height="8" fill="#FFC837" style="--bx: -50px; --by: -70px; --fx: -80px; --fy: 30px; --r1: 15deg; --r2: -90deg;" />
  <polygon class="confetti" points="145,73 151,85 139,85" fill="#4DEDFF" style="--bx: -75px; --by: -20px; --fx: -110px; --fy: 40px; --r1: -30deg; --r2: 45deg;" />
  <circle class="confetti" cx="145" cy="80" r="4" fill="#9B59B6" style="--bx: -40px; --by: -90px; --fx: -65px; --fy: 10px; --r1: 0deg; --r2: 180deg;" />
  <circle class="confetti-alt" cx="145" cy="80" r="6" fill="#2ECC71" style="--bx: -85px; --by: -40px; --fx: -125px; --fy: 15px; --r1: 30deg; --r2: 150deg;" />

  <!-- Lote 2: Confetes Superior e Centro-Esquerda -->
  <path class="confetti" d="M140,80 Q145,70 150,80" stroke="#FF8C42" stroke-width="4" stroke-linecap="round" fill="none" style="--bx: -10px; --by: -100px; --fx: -10px; --fy: -20px; --r1: 45deg; --r2: -45deg;" />
  <rect class="confetti" x="141" y="76" width="10" height="10" rx="2" fill="#FF4D94" style="--bx: 25px; --by: -110px; --fx: 30px; --fy: -30px; --r1: 60deg; --r2: 180deg;" />
  <polygon class="confetti" points="145,74 151,86 139,86" fill="#FFC837" style="--bx: 60px; --by: -120px; --fx: 75px; --fy: -25px; --r1: 90deg; --r2: 270deg;" />
  <circle class="confetti-alt" cx="145" cy="80" r="5" fill="#FF8C42" style="--bx: 0px; --by: -120px; --fx: 5px; --fy: -40px; --r1: -15deg; --r2: 90deg;" />

  <!-- Lote 3: Confetes no Topo do Texto -->
  <circle class="confetti" cx="145" cy="80" r="6" fill="#4DEDFF" style="--bx: 90px; --by: -90px; --fx: 110px; --fy: -15px; --r1: 0deg; --r2: 0deg;" />
  <rect class="confetti" x="142" y="77" width="6" height="6" fill="#9B59B6" style="--bx: 120px; --by: -110px; --fx: 145px; --fy: -35px; --r1: 20deg; --r2: 90deg;" />
  <path class="confetti-alt" d="M140,78 Q148,68 152,82" stroke="#FF4D94" stroke-width="4" stroke-linecap="round" fill="none" style="--bx: 155px; --by: -105px; --fx: 180px; --fy: -30px; --r1: -30deg; --r2: 60deg;" />

  <!-- Lote 4: Confetes na Direita do Texto -->
  <circle class="confetti" cx="145" cy="80" r="7" fill="#FF8C42" style="--bx: 185px; --by: -80px; --fx: 215px; --fy: 10px; --r1: 0deg; --r2: 360deg;" />
  <polygon class="confetti" points="145,72 153,84 137,84" fill="#FFC837" style="--bx: 215px; --by: -60px; --fx: 245px; --fy: 25px; --r1: 45deg; --r2: -45deg;" />
  <rect class="confetti" x="140" y="75" width="9" height="9" fill="#4DEDFF" style="--bx: 235px; --by: -110px; --fx: 270px; --fy: -15px; --r1: 15deg; --r2: 135deg;" />
  <circle class="confetti" cx="145" cy="80" r="4" fill="#9B59B6" style="--bx: 255px; --by: -70px; --fx: 290px; --fy: 30px; --r1: 0deg; --r2: 0deg;" />
  <circle class="confetti-alt" cx="145" cy="80" r="6" fill="#2ECC71" style="--bx: 275px; --by: -95px; --fx: 315px; --fy: -5px; --r1: 40deg; --r2: 160deg;" />
  
  <!-- Lote 5: Confetes no Canto Direiro Superior/Inferior -->
  <rect class="confetti" x="141" y="76" width="7" height="7" rx="2" fill="#FF4D94" style="--bx: 280px; --by: -90px; --fx: 330px; --fy: 10px; --r1: -10deg; --r2: 120deg;" />
  <path class="confetti" d="M140,80 Q145,70 150,80" stroke="#FFC837" stroke-width="5" stroke-linecap="round" fill="none" style="--bx: 300px; --by: -115px; --fx: 350px; --fy: -20px; --r1: 70deg; --r2: -20deg;" />
  <circle class="confetti" cx="145" cy="80" r="6" fill="#FF8C42" style="--bx: 320px; --by: -60px; --fx: 370px; --fy: 35px; --r1: 0deg; --r2: 0deg;" />
  <polygon class="confetti" points="145,74 150,86 140,86" fill="#4DEDFF" style="--bx: 340px; --by: -100px; --fx: 395px; --fy: 0px; --r1: 40deg; --r2: 200deg;" />
  <rect class="confetti" x="140" y="75" width="10" height="10" fill="#9B59B6" style="--bx: 360px; --by: -80px; --fx: 415px; --fy: 25px; --r1: -45deg; --r2: 45deg;" />
</svg>
