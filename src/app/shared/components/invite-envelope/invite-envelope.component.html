<org-surface variant="card" [flush]="true" [testId]="testId()">
  <article class="invite-envelope" [class]="theme().className" [attr.aria-labelledby]="titleId()">
    <a
      class="invite-envelope__front"
      data-testid="event-card-link"
      [routerLink]="link()"
      [attr.aria-label]="'Abrir o convite: ' + event().title"
    >
      <!-- The envelope dressed like its letter: a fine gold frame, a gilt edge on the flap. -->
      <span class="invite-envelope__frame" aria-hidden="true"></span>
      <span class="invite-envelope__flap-trim" aria-hidden="true"></span>
      <span class="invite-envelope__flap" aria-hidden="true"></span>
      <span class="invite-envelope__seal" aria-hidden="true">{{ initial() }}</span>
      <span class="invite-envelope__address">
        @if (firstName()) {
          <span class="invite-envelope__to">Para {{ firstName() }}</span>
        }
        <h3 class="invite-envelope__title" [id]="titleId()">{{ event().title }}</h3>
        @if (when()) {
          <span class="invite-envelope__when">{{ when() }}</span>
        }
      </span>
      <span class="invite-envelope__tags">
        <!-- Only a party the invitation has no words of its own for says what it is. -->
        @if (showCategory()) {
          <org-badge
            [label]="categoryLabel()"
            [variant]="categoryVariant()"
            [hue]="categoryHue()"
            [gradient]="false"
          />
        }
        @if (status(); as status) {
          <org-badge
            data-testid="event-status"
            [label]="status.label"
            [variant]="status.variant"
            [gradient]="false"
          />
        }
      </span>
    </a>

    <div class="invite-envelope__extras">
      <ng-content select="[inviteBody]" />
      <div class="invite-envelope__actions">
        <ng-content select="[inviteFooter]" />
      </div>
    </div>
  </article>
</org-surface>
