<org-surface variant="card">
  <org-card-header
    icon="checklist"
    heading="Lista de Itens"
    [subheading]="items().length + ' itens cadastrados'"
  />

  <div class="items-card__add">
    <org-text-field
      class="items-card__name-field"
      label="Nome do item"
      placeholder="Ex: Bolo de milho"
      testId="item-name-input"
      [(value)]="newItemName"
    />
    <org-text-field
      class="items-card__qty-field"
      label="Quantidade"
      type="number"
      [min]="1"
      testId="item-qty-input"
      [value]="newItemQuantity().toString()"
      (valueChange)="setQuantity($event)"
    />
    <org-icon-button
      class="items-card__add-btn"
      ariaLabel="Adicionar item"
      testId="add-item-btn"
      icon="add"
      variant="primary"
      [gradient]="false"
      [disabled]="!newItemName().trim()"
      (pressed)="submit()"
    />
  </div>

  @if (items().length > 0) {
    <ul class="items-card__list" role="list" data-testid="item-list">
      @for (item of items(); track item.id) {
        <li class="items-card__item" role="listitem">
          <div class="items-card__item-info">
            <span class="items-card__item-name">{{ item.name }}</span>
            @if (item.quantity > 1) {
              <span class="items-card__item-qty">× {{ item.quantity }}</span>
            }
            @if (item.claimedBy) {
              <span class="items-card__item-claimed">
                <org-icon name="person" size="sm" color="currentColor" />
                {{ item.claimedBy.name }}
              </span>
            }
          </div>
          <org-icon-button
            [ariaLabel]="'Remover ' + item.name"
            icon="delete"
            variant="default"
            [gradient]="false"
            (pressed)="remove.emit(item)"
          />
        </li>
      }
    </ul>
  }
</org-surface>
