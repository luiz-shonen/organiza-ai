<section
  class="org-banner"
  [class]="'org-banner org-banner--' + variant()"
  data-testid="org-banner"
  role="alert"
>
  @if (icon(); as icon) {
    <org-icon class="org-banner__icon" [name]="icon" color="currentColor" />
  }
  <p class="org-banner__message">{{ message() }}</p>
  <!-- An optional action ("Descartar") at the end of the banner. -->
  <ng-content />
</section>
