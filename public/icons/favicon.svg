<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 164.67577 144"
   fill="none"
   version="1.1"
   id="svg9"
   sodipodi:docname="favicon.svg"
   width="164.67577"
   height="144"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview9"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="5.665"
     inkscape:cx="51.279788"
     inkscape:cy="49.867608"
     inkscape:window-width="2560"
     inkscape:window-height="1351"
     inkscape:window-x="-9"
     inkscape:window-y="-9"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg9" />
  <defs
     id="defs3">
    <!-- Gradiente Vibrante do Checkmark -->
    <linearGradient
       id="partyGradient"
       x1="85.999759"
       y1="66.000184"
       x2="173.99952"
       y2="66.000184"
       gradientTransform="matrix(1.0000028,0,0,1.0000028,-24.324234,-25)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         stop-color="#FF4D94"
         id="stop1" />
      <stop
         offset="50%"
         stop-color="#FF8C42"
         id="stop2" />
      <stop
         offset="100%"
         stop-color="#FFC837"
         id="stop3" />
    </linearGradient>
    <!-- Sombra projetada mais forte para o check saltar aos olhos -->
    <filter
       id="popShadow"
       x="-0.12857142"
       y="-0.12857143"
       width="1.2571428"
       height="1.2571359">
      <feDropShadow
         dx="2"
         dy="4"
         stdDeviation="2"
         flood-color="#FF8C42"
         flood-opacity="0.5" />
    </filter>
  </defs>
  <style
     id="style3">
    /* Traços bem grossos para legibilidade em 16x16px */
    .doodle {
      stroke: #2D3436;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
  <!-- ========================================== -->
  <!-- CONFETES (Congelados no momento da explosão)-->
  <!-- ========================================== -->
  <g
     id="g4"
     transform="translate(-24.324234,-25)">
    <!-- Cima Esquerda -->
    <circle
       cx="45"
       cy="45"
       r="10"
       fill="#ff4d94"
       id="circle3" />
    <rect
       x="25"
       y="80"
       width="12"
       height="12"
       rx="3"
       fill="#ffc837"
       transform="rotate(15,31,86)"
       id="rect3" />
    <!-- Cima Direita -->
    <polygon
       points="145,55 150,30 165,45 "
       fill="#4dedff"
       id="polygon3" />
    <circle
       cx="170"
       cy="85"
       r="8"
       fill="#9b59b6"
       id="circle4" />
    <!-- Baixo Esquerda e Direita -->
    <polygon
       points="30,165 40,150 50,165 "
       fill="#4dedff"
       transform="rotate(-20,40,157)"
       id="polygon4" />
    <rect
       x="155"
       y="145"
       width="14"
       height="14"
       rx="4"
       fill="#ff8c42"
       transform="rotate(45,162,152)"
       id="rect4" />
    <path
       d="m 160,110 q 15,-15 25,5"
       stroke="#ff4d94"
       stroke-width="8"
       stroke-linecap="round"
       fill="none"
       id="path4" />
  </g>
  <!-- ========================================== -->
  <!-- ÍCONE CENTRAL (Totalmente reto e alinhado) -->
  <!-- ========================================== -->
  <g
     id="g9"
     transform="translate(-24.324234,-25)">
    <!-- Base branca da agenda -->
    <rect
       x="45"
       y="45"
       width="110"
       height="120"
       rx="16"
       fill="#ffffff"
       class="doodle"
       id="rect5" />
    <!-- Cabeçalho Rosa Festa -->
    <path
       d="M 45,90 H 155 V 61 c 0,-8.84 -7.16,-16 -16,-16 H 61 c -8.84,0 -16,7.16 -16,16 z"
       fill="#ff4d94"
       class="doodle"
       id="path5" />
    <!-- Espirais (Mais destacadas) -->
    <rect
       x="65"
       y="25"
       width="12"
       height="28"
       rx="6"
       fill="#2d3436"
       id="rect6" />
    <rect
       x="123"
       y="25"
       width="12"
       height="28"
       rx="6"
       fill="#2d3436"
       id="rect7" />
    <!-- Grid simplificado (Apenas dois quadrados para não poluir visualmente) -->
    <rect
       x="65"
       y="110"
       width="28"
       height="28"
       rx="6"
       stroke="#e2e8f0"
       stroke-width="6"
       fill="none"
       id="rect8" />
    <!-- Quadrado de destaque tracejado -->
    <rect
       x="107"
       y="110"
       width="28"
       height="28"
       rx="6"
       stroke="#2d3436"
       stroke-width="6"
       stroke-dasharray="6, 6"
       fill="none"
       id="rect9" />
  </g>
  <!-- ========================================== -->
  <!-- CHECKMARK (A cereja do bolo, saindo do grid)-->
  <!-- ========================================== -->
  <path
     d="m 70.675766,100 20,20 50.000004,-70"
     fill="none"
     stroke="url(#partyGradient)"
     stroke-width="18"
     stroke-linecap="round"
     stroke-linejoin="round"
     filter="url(#popShadow)"
     id="path9"
     style="stroke:url(#partyGradient)" />
</svg>
