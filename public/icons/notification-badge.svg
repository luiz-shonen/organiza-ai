<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26" width="96" height="96">
  <!-- Status-bar badge for phone notifications: the org-logo mark as a white silhouette.
       Android paints only the alpha channel, so the check is cut out of the calendar. -->
  <defs>
    <mask id="cut">
      <rect width="26" height="26" fill="#fff" />
      <path d="M9 16.5l2.6 2.5 5-5" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    </mask>
  </defs>
  <rect x="2" y="5" width="22" height="19" rx="4" fill="#fff" mask="url(#cut)" />
  <path d="M8 2v4.5M18 2v4.5" stroke="#fff" stroke-width="2" stroke-linecap="round" />
</svg>
