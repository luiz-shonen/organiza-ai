<section class="org-confirm-dialog" data-testid="org-confirm-dialog" role="alertdialog" aria-modal="true" [attr.aria-label]="data.title">
  <h2 class="org-confirm-dialog__title">{{ data.title }}</h2>
  <p class="org-confirm-dialog__message">{{ data.message }}</p>
  <div class="org-confirm-dialog__actions">
    <org-button
      [label]="data.cancelLabel ?? 'Cancelar'"
      variant="text"
      [gradient]="false"
      testId="org-confirm-cancel"
      (pressed)="cancel()"
    />
    <org-button
      [label]="data.confirmLabel ?? 'Confirmar'"
      testId="org-confirm-submit"
      (pressed)="confirm()"
    />
  </div>
</section>
