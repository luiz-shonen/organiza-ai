<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1628" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A1628" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Night sky fade at bottom -->
  <rect x="0" y="0" width="800" height="120" fill="url(#skyGrad)"/>

  <!-- Rolling hills silhouette -->
  <path d="M0,95 Q100,70 200,85 Q300,95 400,80 Q500,65 600,82 Q700,95 800,78 L800,120 L0,120 Z" fill="#0A1628" opacity="0.5"/>

  <!-- Town of Bethlehem silhouette -->
  <!-- Building cluster left -->
  <rect x="240" y="68" width="18" height="30" fill="#0F1D36"/>
  <rect x="260" y="60" width="22" height="38" fill="#0F1D36"/>
  <rect x="284" y="72" width="14" height="26" fill="#0F1D36"/>

  <!-- Central structure (inn/stable area) -->
  <rect x="310" y="55" width="28" height="43" fill="#0F1D36"/>
  <polygon points="310,55 324,42 338,55" fill="#0F1D36"/>
  <!-- Small window with warm light -->
  <rect x="319" y="70" width="6" height="6" rx="1" fill="#FFD700" opacity="0.6"/>

  <!-- Manger/stable (smaller, to the side) -->
  <polygon points="355,76 380,60 405,76" fill="#0F1D36"/>
  <rect x="358" y="76" width="44" height="22" fill="#0F1D36"/>
  <!-- Warm glow from manger opening -->
  <rect x="370" y="82" width="14" height="16" rx="2" fill="#FFD700" opacity="0.35"/>

  <!-- Building cluster right -->
  <rect x="420" y="64" width="20" height="34" fill="#0F1D36"/>
  <rect x="442" y="70" width="16" height="28" fill="#0F1D36"/>
  <rect x="460" y="66" width="24" height="32" fill="#0F1D36"/>
  <polygon points="460,66 472,52 484,66" fill="#0F1D36"/>

  <!-- Palm trees -->
  <line x1="220" y1="98" x2="220" y2="65" stroke="#0F1D36" stroke-width="3"/>
  <path d="M210,65 Q220,55 230,65" fill="#0F1D36"/>
  <path d="M206,62 Q220,50 234,62" fill="#0F1D36"/>

  <line x1="510" y1="98" x2="510" y2="70" stroke="#0F1D36" stroke-width="3"/>
  <path d="M500,70 Q510,60 520,70" fill="#0F1D36"/>
  <path d="M496,67 Q510,55 524,67" fill="#0F1D36"/>

  <!-- Tiny stars in the sky portion -->
  <circle cx="120" cy="40" r="1" fill="#FFF8DC" opacity="0.7"/>
  <circle cx="320" cy="20" r="1.2" fill="#FFF8DC" opacity="0.6"/>
  <circle cx="550" cy="35" r="1" fill="#FFF8DC" opacity="0.5"/>
  <circle cx="680" cy="25" r="1.3" fill="#FFF8DC" opacity="0.6"/>
  <circle cx="80" cy="55" r="0.8" fill="#FFF8DC" opacity="0.4"/>
  <circle cx="420" cy="15" r="1" fill="#FFF8DC" opacity="0.7"/>
  <circle cx="720" cy="50" r="0.8" fill="#FFF8DC" opacity="0.5"/>
</svg>
