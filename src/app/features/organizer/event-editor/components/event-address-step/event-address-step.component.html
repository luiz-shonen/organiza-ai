@let addressForm = form();
<form
  [formGroup]="addressForm"
  class="event-step"
  id="address-form"
  data-testid="event-editor-step-2"
>
  <org-surface variant="card">
    <div class="event-step__card">
      <org-card-header
        heading="Endereço do evento"
        subheading="Digite o CEP e completamos o resto"
      />
      <div class="event-step__row event-step__row--halves">
        <org-text-field
          label="CEP"
          placeholder="00000-000"
          [required]="true"
          [maxLength]="9"
          [error]="fieldError(addressForm.controls.cep, 'CEP é obrigatório')"
          formControlName="cep"
          testId="event-cep-input"
          (valueChange)="cepInput.emit($event)"
        />

        <div class="event-step__number">
          <org-text-field
            label="Número"
            placeholder="Ex: 123"
            [required]="!noNumber().checked"
            [maxLength]="7"
            [error]="fieldError(addressForm.controls.number, 'Número é obrigatório')"
            formControlName="number"
            testId="event-number-input"
          />
          <org-checkbox
            label="Sem número"
            testId="event-no-number"
            [checked]="noNumber().checked"
            [disabled]="noNumber().disabled"
            (checkedChange)="
              addressForm.controls.noNumber.setValue($event);
              addressForm.controls.noNumber.markAsDirty()
            "
          />
        </div>
      </div>

      @if (partlyFound()) {
        <p class="event-step__locked-note" data-testid="event-address-partial">
          <org-icon name="info" color="currentColor" />
          O CEP não trouxe o endereço completo. Complete o que falta abaixo.
        </p>
      }

      <org-text-field
        label="Endereço"
        [class.event-step__locked]="isLocked('address')"
        [placeholder]="isLocked('address') ? 'Preenchido pelo CEP' : 'Ex: Estrada da Serra, Km 12'"
        [readOnly]="isLocked('address')"
        [suffixIcon]="isLocked('address') ? 'lock' : null"
        [required]="true"
        [error]="
          addressForm.controls.address.hasError('required') && addressForm.controls.address.touched
            ? 'Endereço é obrigatório'
            : ''
        "
        formControlName="address"
        testId="event-street-input"
      />

      <div class="event-step__row event-step__row--wide-narrow">
        <org-text-field
          label="Bairro"
          [class.event-step__locked]="isLocked('neighborhood')"
          [placeholder]="isLocked('neighborhood') ? 'Preenchido pelo CEP' : 'Ex: Zona rural'"
          [readOnly]="isLocked('neighborhood')"
          [suffixIcon]="isLocked('neighborhood') ? 'lock' : null"
          [required]="true"
          [error]="
            addressForm.controls.neighborhood.hasError('required') &&
            addressForm.controls.neighborhood.touched
              ? 'Bairro é obrigatório'
              : ''
          "
          formControlName="neighborhood"
          testId="event-neighborhood-input"
        />

        <org-text-field
          label="Cidade/UF"
          [class.event-step__locked]="isLocked('city')"
          [placeholder]="isLocked('city') ? 'Preenchido pelo CEP' : 'Ex: Jaboticatubas/MG'"
          [readOnly]="isLocked('city')"
          [suffixIcon]="isLocked('city') ? 'lock' : null"
          [required]="true"
          [error]="
            addressForm.controls.city.hasError('required') && addressForm.controls.city.touched
              ? 'Cidade/UF é obrigatória'
              : ''
          "
          formControlName="city"
          testId="event-city-input"
        />
      </div>

      <org-text-field
        label="Complemento (opcional)"
        placeholder="Ex: Km 12, sítio Boa Vista, casa 2"
        [maxLength]="complementMax"
        formControlName="complement"
        testId="event-complement-input"
      />

      <org-textarea-field
        label="Como chegar (opcional)"
        placeholder="Ex: depois da ponte, entre na estrada de terra à direita. Portão azul."
        hint="Ajuda quem vai a lugares que o mapa não acha direito."
        [rows]="3"
        [maxLength]="directionsMax"
        formControlName="directions"
        testId="event-directions-input"
      />
    </div>
  </org-surface>
  @if (missingMessage(); as message) {
    <div class="event-step__blocked" data-testid="step-missing-fields">
      <org-banner variant="error" icon="info" [message]="message" />
    </div>
  }
  <div class="event-step__actions">
    <org-button label="Voltar" variant="text" (pressed)="back.emit()" />
    <org-button
      label="Próximo"
      testId="stepper-next-btn"
      [gradient]="false"
      (pressed)="tryNext()"
    />
  </div>
</form>
