<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<main class="login">
  <div class="login__icon-badge">
    <mat-icon>celebration</mat-icon>
  </div>
  
  <h1 class="login__title org-gradient-text">
    Organiza AI
  </h1>
  <p class="login__subtitle">
    {{ isRegisterMode() ? 'Crie sua conta para organizar eventos' : 'Acesse sua conta para continuar' }}
  </p>

  <div class="glass-card login__card">
    
    <div class="login__tabs">
      <button
        type="button"
        (click)="isRegisterMode.set(false)"
        [class]="!isRegisterMode() ? 'login__tab login__tab--active' : 'login__tab'"
      >
        Entrar
      </button>
      <button
        type="button"
        (click)="isRegisterMode.set(true)"
        [class]="isRegisterMode() ? 'login__tab login__tab--active' : 'login__tab'"
      >
        Cadastrar
      </button>
    </div>

    @if (errorMessage(); as error) {
      <div class="login__error">
        <mat-icon>error</mat-icon>
        {{ error }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="login__form">
      
      <div class="login__field">
        <mat-icon class="login__field-icon">email</mat-icon>
        <input 
          formControlName="email" type="email" autocomplete="email" required
          class="glass-input login__input"
          placeholder="E-mail" 
        />
      </div>

      <div class="login__field">
        <mat-icon class="login__field-icon">lock</mat-icon>
        <input 
          formControlName="password" [type]="hidePassword() ? 'password' : 'text'" autocomplete="current-password" required
          class="glass-input login__input"
          placeholder="Senha" 
        />
        <button 
          type="button" (click)="hidePassword.set(!hidePassword())"
          class="login__toggle-pwd"
        >
          <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </div>

      <button 
        type="submit"
        [disabled]="form.invalid || loading()"
        class="btn-primary-org login__submit-btn"
      >
        @if (loading()) {
          <mat-spinner diameter="20" color="accent"></mat-spinner>
        } @else {
          {{ isRegisterMode() ? 'Criar Conta' : 'Entrar' }}
        }
      </button>

    </form>

    <div class="login__divider">
      <span>OU</span>
    </div>

    <button
      type="button"
      [disabled]="loading()"
      (click)="loginWithGoogle()"
      class="login__google-btn"
    >
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="login__google-icon" />
      Entrar com Google
    </button>

  </div>
</main>
