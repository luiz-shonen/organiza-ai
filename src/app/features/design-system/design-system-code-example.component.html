<details class="org-ds-code-example" [attr.aria-label]="label()">
  <summary class="org-ds-code-example__summary">
    <span>{{ label() }}</span>
    <mat-icon aria-hidden="true">expand_more</mat-icon>
  </summary>
  <div class="org-ds-code-example__content">
    <header class="org-ds-code-example__header">
      <button mat-button type="button" (click)="copy()" [attr.aria-label]="copied() ? 'Código copiado' : 'Copiar código'">
        <mat-icon aria-hidden="true">{{ copied() ? 'check' : 'content_copy' }}</mat-icon>
        {{ copied() ? 'Copiado' : 'Copiar' }}
      </button>
    </header>
    <pre><code>{{ code() }}</code></pre>
  </div>
</details>
