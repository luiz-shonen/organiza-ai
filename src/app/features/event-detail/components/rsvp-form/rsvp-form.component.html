    <div class="rsvp">
      <h2 class="rsvp__title org-gradient-text">
        Você vai?
      </h2>
      
      <div class="glass-card rsvp__card">
        <!-- Optional Tabs (Visual only for now) -->
        <div class="rsvp__tabs">
          <button class="rsvp__tab rsvp__tab--active">
            Somente Eu
          </button>
          <button class="rsvp__tab">
            Com Família
          </button>
        </div>

        <form #f="ngForm" (ngSubmit)="onSubmit(f)" class="rsvp__form">
          
          <div class="rsvp__input-group">
            <mat-icon class="rsvp__input-icon">person</mat-icon>
            <input 
              name="name" ngModel required 
              class="glass-input rsvp__input"
              placeholder="Nome completo (Ex: João da Silva)" 
            />
          </div>

          <div class="rsvp__input-group">
            <mat-icon class="rsvp__input-icon">phone</mat-icon>
            <input 
              name="phone" ngModel required 
              class="glass-input rsvp__input"
              placeholder="WhatsApp (Ex: 11999999999)" 
            />
          </div>

          <!-- Action -->
          <div class="rsvp__actions">
            <button 
              type="submit"
              [disabled]="f.invalid || isSubmitting()"
              class="btn-primary-org rsvp__submit"
            >
              @if (isSubmitting()) {
                <mat-spinner diameter="20" color="accent"></mat-spinner>
              } @else {
                Confirmar Presença
              }
            </button>
          </div>
        </form>
      </div>
    </div>
