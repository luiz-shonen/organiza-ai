<section class="rsvp-form">
  <h2 class="rsvp-form__title org-gradient-text">
    Você vai?
  </h2>
  
  <div class="glass-card rsvp-form__card">
    <form #f="ngForm" (ngSubmit)="onSubmit(f)" class="rsvp-form__body">
      
      <div class="rsvp-form__field">
        <mat-icon class="rsvp-form__field-icon">person</mat-icon>
        <input 
          name="name" ngModel required 
          class="glass-input rsvp-form__input"
          placeholder="Nome completo (Ex: João da Silva)" 
        />
      </div>

      <div class="rsvp-form__field">
        <mat-icon class="rsvp-form__field-icon">phone</mat-icon>
        <input 
          name="phone" ngModel required 
          class="glass-input rsvp-form__input"
          placeholder="WhatsApp (Ex: 11999999999)" 
        />
      </div>

      <!-- Action -->
      <div class="rsvp-form__actions">
        <button 
          type="submit"
          [disabled]="f.invalid || isSubmitting()"
          class="btn-primary-org rsvp-form__submit-btn"
        >
          @if (isSubmitting()) {
            <mat-spinner diameter="20" color="accent"></mat-spinner>
          } @else {
            Confirmar Presença
          }
        </button>
      </div>
    </form>
  </div>
</section>
