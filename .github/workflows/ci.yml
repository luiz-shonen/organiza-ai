name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality & Build Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_code_changes: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Paths Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Lint TypeScript & Templates (ESLint)
        if: steps.filter.outputs.code == 'true'
        run: npm run lint

      - name: Lint Stylesheets (Stylelint)
        if: steps.filter.outputs.code == 'true'
        run: npm run lint:styles

      - name: Validate Design System Contracts
        if: steps.filter.outputs.code == 'true'
        run: npm run lint:contracts

      - name: Run Script Unit Tests
        if: steps.filter.outputs.code == 'true'
        run: npm run test:scripts

      - name: Build Application
        if: steps.filter.outputs.code == 'true'
        run: npm run build

  # The rules are deployed to production on every merge to main, so they are tested here first.
  firestore-rules:
    name: Firestore Rules Tests
    needs: quality
    if: needs.quality.outputs.has_code_changes == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java (Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Run Firestore Rules Tests
        run: npm run test:rules

  e2e:
    name: Playwright E2E Tests
    needs: quality
    if: needs.quality.outputs.has_code_changes == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers & System Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright System Dependencies (Cached Browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e:ci

      - name: Upload Test Report & Failure Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  # Slowed-down videos of the E2E tests this PR adds or changes, posted in one PR comment so a
  # reviewer can watch the new behaviour instead of testing it by hand. Pass/fail is the `e2e`
  # job's call; this one only records. Fork PRs are skipped: their token cannot push or comment.
  e2e-videos:
    name: E2E Videos of Changed Tests
    needs: quality
    if: github.event_name == 'pull_request' && needs.quality.outputs.has_code_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the GIF/MP4 files to the e2e-videos branch
      pull-requests: write
    concurrency:
      group: e2e-videos-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers & System Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright System Dependencies (Cached Browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg)

      - name: Record Videos of the Changed Tests
        run: node scripts/e2e-changed-videos.mjs --base origin/${{ github.base_ref }}

      - name: Upload Videos
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-videos
          path: e2e-videos/*.webm
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish GIF/MP4 to the e2e-videos Branch
        id: media
        if: hashFiles('e2e-videos/*.gif') != ''
        run: bash scripts/e2e-videos-branch.sh publish ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }} >> "$GITHUB_OUTPUT"

      - name: Post or Update the PR Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MEDIA_BASE_URL: ${{ steps.media.outputs.base_url }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: node scripts/e2e-changed-videos.mjs comment

  gemini-review:
    name: Gemini Code Review
    needs: [quality, e2e]
    if: github.event_name == 'pull_request' && github.event.action == 'opened' && !cancelled() && needs.quality.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    # GEMINI_MODEL + four fallbacks, a 4 min cap per call, 90s of waits: under ~22 min.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/gemini-pr-review.mjs
