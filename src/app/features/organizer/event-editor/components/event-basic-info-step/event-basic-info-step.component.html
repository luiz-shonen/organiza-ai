@let basicInfoForm = form();
<form
  [formGroup]="basicInfoForm"
  class="event-step"
  id="basic-info-form"
  data-testid="event-editor-step-1"
>
  <org-surface variant="card">
    <div class="event-step__card">
      <org-card-header
        icon="edit_note"
        heading="Informações do evento"
        subheading="O básico para seus convidados"
      />
      <org-text-field
        label="Título do evento"
        placeholder="Ex: Festa Junina 2026"
        [required]="true"
        [maxLength]="titleMaxLength"
        [error]="fieldError(basicInfoForm.controls.title, 'Título é obrigatório')"
        formControlName="title"
        testId="event-title-input"
      />

      <div class="event-step__category">
        <span class="event-step__category-label">Categoria do evento</span>
        <div
          class="event-step__category-options"
          role="group"
          aria-label="Categoria do evento"
          data-testid="category-options"
        >
          @for (cat of categories(); track cat.name) {
            <org-chip
              [label]="cat.name"
              [selectable]="true"
              [selected]="basicInfoForm.controls.category.value === cat.name"
              (selectionChange)="selectCategory(cat.name)"
            />
          }
          <org-chip
            label="Personalizar"
            testId="custom-category-chip"
            [selectable]="true"
            [selected]="isCustomCategory()"
            (selectionChange)="selectCustomCategory()"
          />
        </div>
        @if (isCustomCategory()) {
          <org-text-field
            label="Tipo do evento"
            placeholder="Ex: Chá revelação"
            testId="custom-category-input"
            formControlName="category"
            [required]="true"
            [maxLength]="categoryMaxLength"
            [error]="fieldError(basicInfoForm.controls.category, 'Digite o tipo do evento')"
          />
        } @else if (
          fieldError(basicInfoForm.controls.category, 'Selecione uma categoria');
          as error
        ) {
          <span class="event-step__error" role="alert">{{ error }}</span>
        }
      </div>

      <org-textarea-field
        label="Descrição"
        placeholder="Descreva o evento..."
        [rows]="4"
        [required]="true"
        [maxLength]="descriptionMaxLength"
        [error]="fieldError(basicInfoForm.controls.description, 'Descrição é obrigatória')"
        formControlName="description"
        testId="event-description-input"
      />

      <div class="event-step__row event-step__row--wide-narrow">
        <org-date-field
          label="Data do evento"
          [min]="minDate()"
          [required]="true"
          [error]="dateError()"
          formControlName="date"
          testId="event-date-input"
        />

        <org-time-field
          label="Hora"
          [required]="true"
          [error]="
            basicInfoForm.controls.time.hasError('required') && basicInfoForm.controls.time.touched
              ? 'Hora é obrigatória'
              : ''
          "
          formControlName="time"
          testId="event-time-input"
        />
      </div>
    </div>
  </org-surface>
  <div class="event-step__actions">
    <org-button label="Cancelar" variant="text" (pressed)="cancelled.emit()" />
    <org-button
      label="Próximo"
      testId="stepper-next-btn"
      [gradient]="false"
      [disabled]="basicInfoForm.invalid"
      (pressed)="next.emit()"
    />
  </div>
</form>
