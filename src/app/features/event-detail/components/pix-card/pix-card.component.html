<mat-card class="pix-card glass-card" appearance="outlined">
  <mat-card-header class="glass-card">
    <mat-icon matCardAvatar class="pix-card__icon">pix</mat-icon>
    <mat-card-title class="glass-card">Rachadinha via Pix</mat-card-title>
    <mat-card-subtitle class="glass-card">Contribua com o evento!</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content class="glass-card">
    <div class="pix-card__key-container">
      <code class="pix-card__key" aria-label="Chave Pix">{{ pixKey() }}</code>
    </div>
  </mat-card-content>
  <mat-card-actions class="glass-card">
    <button
      mat-flat-button
      class="pix-card__copy-btn"
      (click)="copyToClipboard()"
      aria-label="Copiar chave Pix"
    >
      <mat-icon>content_copy</mat-icon>
      Copiar Chave
    </button>
  </mat-card-actions>
</mat-card>
