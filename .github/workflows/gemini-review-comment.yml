name: Gemini PR Review (On Demand)

on:
  issue_comment:
    types: [created]

jobs:
  comment-review:
    name: On-Demand Gemini Review
    # Only people with write access may trigger it: the job checks out the PR head
    # and runs it with GEMINI_API_KEY, so a fork author must never be able to start it.
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/review') || contains(github.event.comment.body, '/gemini review'))
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write

    steps:
      - name: Fetch PR Metadata
        id: pr-meta
        # Runs before checkout, so gh needs the repository explicitly.
        run: |
          PR_DATA=$(gh pr view ${{ github.event.issue.number }} --repo "${{ github.repository }}" --json baseRefOid,headRefOid,headRefName,isCrossRepository)
          echo "base_sha=$(echo "$PR_DATA" | jq -r .baseRefOid)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(echo "$PR_DATA" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(echo "$PR_DATA" | jq -r .headRefName)" >> "$GITHUB_OUTPUT"
          echo "is_fork=$(echo "$PR_DATA" | jq -r .isCrossRepository)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # /review also re-runs CI, so the PR checks are fresh next to the new review.
      # A fork branch does not exist in this repository, so it cannot be dispatched.
      - name: Start CI on the PR Branch
        if: steps.pr-meta.outputs.is_fork == 'false'
        # A branch cut before ci.yml accepted workflow_dispatch rejects it; the review still runs.
        continue-on-error: true
        run: gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$HEAD_REF"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ steps.pr-meta.outputs.head_ref }}

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr-meta.outputs.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          BASE_SHA: ${{ steps.pr-meta.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr-meta.outputs.head_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IS_ON_DEMAND: 'true'
        run: node scripts/gemini-pr-review.mjs

      - name: Report Failure on the PR
        if: failure()
        run: |
          gh pr comment ${{ github.event.issue.number }} --repo "${{ github.repository }}" \
            --body "⚠️ A revisão sob demanda do Gemini falhou. Veja o log em ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
