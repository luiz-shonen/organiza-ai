<section
  class="rsvp-drawer"
  data-testid="rsvp-drawer"
  role="dialog"
  aria-modal="true"
  aria-labelledby="rsvp-drawer-title"
>
  <header class="rsvp-drawer__header">
    <div>
      <h2 id="rsvp-drawer-title" class="rsvp-drawer__title">Confirme seus dados</h2>
      <p class="rsvp-drawer__description">
        Sua presença principal permanece vinculada à sua conta verificada.
      </p>
    </div>
    <org-icon-button
      ariaLabel="Fechar confirmação"
      icon="close"
      data-testid="rsvp-close-btn"
      (pressed)="closeDrawer()"
    />
  </header>

  <form [formGroup]="form" class="rsvp-drawer__form" id="rsvp-form">
    <div class="rsvp-drawer__content">
      <org-text-field
        class="rsvp-drawer__field"
        label="Seu nome"
        formControlName="name"
        [required]="true"
        [maxLength]="nameMaxLength"
        testId="rsvp-name-input"
        [error]="fieldError(form.controls.name, 'Nome é obrigatório')"
      />

      <org-text-field
        class="rsvp-drawer__field"
        label="WhatsApp / Telefone"
        type="tel"
        formControlName="phone"
        placeholder="(11) 99999-9999"
        [required]="true"
        [mask]="maskPhone"
        testId="rsvp-phone-input"
        [error]="fieldError(form.controls.phone, 'Telefone é obrigatório')"
      />

      <org-text-field
        class="rsvp-drawer__field"
        label="Outros acompanhantes"
        type="number"
        hint="De 0 a 10 acompanhantes fora da família"
        formControlName="companionsCount"
        testId="rsvp-companions-input"
        (valueChange)="onCompanionsCountChange($event)"
        [error]="
          form.controls.companionsCount.invalid && form.controls.companionsCount.touched
            ? 'Informe um número entre 0 e 10'
            : ''
        "
      />

      <div formArrayName="companions" class="rsvp-drawer__companions" aria-label="Acompanhantes">
        @for (control of companions.controls; track $index) {
          <org-text-field
            class="rsvp-drawer__field"
            [label]="'Acompanhante ' + ($index + 1)"
            [formControlName]="$index"
            [required]="true"
            [maxLength]="nameMaxLength"
            [error]="fieldError(control, 'Nome do acompanhante é obrigatório')"
          />
        }
      </div>

      <div class="rsvp-drawer__family" data-testid="family-selector">
        <app-family-selector
          [members]="familyMembers()"
          [selectedIds]="selectedFamilyMemberIds()"
          [isAddingInline]="isAddingInline()"
          (toggleMember)="onToggleFamilyMember($event)"
          (selectAll)="onSelectAllFamily($event)"
          (addInlineMember)="onAddInlineFamilyMember($event)"
        />
      </div>
    </div>

    <footer class="rsvp-drawer__actions">
      <org-button
        label="Cancelar"
        variant="secondary"
        [gradient]="false"
        data-testid="rsvp-cancel-btn"
        (pressed)="closeDrawer()"
      />
      <org-button label="Confirmar" data-testid="rsvp-confirm-btn" (pressed)="submit()" />
    </footer>
  </form>
</section>
