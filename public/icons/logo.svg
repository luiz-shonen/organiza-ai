<svg viewBox="0 0 600 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="partyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D94" />
      <stop offset="50%" stop-color="#FF8C42" />
      <stop offset="100%" stop-color="#FFC837" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#FF8C42" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    /* Estilos base do traço (Doodle) */
    .doodle {
      stroke: #2D3436;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 1. O Pulo do Calendário */
    .calendar-icon {
      transform-origin: 80px 80px;
      animation: iconBounce 6s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
    }

    @keyframes iconBounce {
      0%, 27% { transform: scale(1) translateY(0); }
      30% { transform: scale(1.1) translateY(-6px); }
      38%, 95% { transform: scale(1) translateY(0); }
      100% { transform: scale(1) translateY(0); }
    }

    /* 2. O Checkmark Sendo Desenhado */
    .check {
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      filter: url(#glow);
      animation: drawCheck 6s ease-out infinite;
    }

    @keyframes drawCheck {
      0%, 15% { stroke-dashoffset: 80; opacity: 1; }
      30%, 85% { stroke-dashoffset: 0; opacity: 1; }
      90%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* 3. A Chuva de Confetes Volumosa */
    .confetti {
      opacity: 0;
      transform-origin: 80px 80px;
      animation: confettiRain 6s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }

    @keyframes confettiRain {
      0%, 29% {
        opacity: 0;
        transform: translate(0, 0) scale(0) rotate(0deg);
      }
      31% {
        opacity: 1;
        transform: translate(var(--bx), var(--by)) scale(1.2) rotate(var(--r1));
      }
      80% {
        opacity: 1;
        transform: translate(var(--fx), var(--fy)) scale(1) rotate(var(--r2));
      }
      90%, 100% {
        opacity: 0;
        transform: translate(var(--fx), calc(var(--fy) + 40px)) scale(0) rotate(var(--r2));
      }
    }

    /* Texto da Logo Totalmente em Degradê */
    .brand-text {
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
      font-weight: 900;
      font-size: 56px;
      letter-spacing: -1.5px;
      fill: url(#partyGradient);
    }
  </style>

  <g class="calendar-icon">
    <rect x="30" y="30" width="100" height="110" rx="12" fill="#FFFFFF" class="doodle" />
    <path d="M30,70 L130,70 L130,42 C130,35.37 124.63,30 118,30 L42,30 C35.37,30 30,35.37 30,42 Z" fill="#FF4D94" class="doodle"/>
    
    <rect x="50" y="20" width="8" height="20" rx="4" fill="#2D3436" />
    <rect x="102" y="20" width="8" height="20" rx="4" fill="#2D3436" />

    <g stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" fill="none">
      <rect x="45" y="85" width="20" height="20" rx="4" />
      <rect x="70" y="85" width="20" height="20" rx="4" stroke="#2D3436" stroke-dasharray="3 3"/>
      <rect x="95" y="85" width="20" height="20" rx="4" />
      <rect x="45" y="110" width="20" height="20" rx="4" />
      <rect x="70" y="110" width="20" height="20" rx="4" />
      <rect x="95" y="110" width="20" height="20" rx="4" />
    </g>

    <path class="check" d="M 65,95 L 75,105 L 105,75" fill="none" stroke="url(#partyGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="160" y="105" text-anchor="start" class="brand-text">
    Organiza AI
  </text>

  <circle class="confetti" cx="80" cy="80" r="5" fill="#FF4D94" style="--bx: -40px; --by: -50px; --fx: -60px; --fy: 20px; --r1: 45deg; --r2: 120deg;" />
  <rect class="confetti" x="75" y="75" width="8" height="8" fill="#FFC837" style="--bx: -20px; --by: -70px; --fx: -30px; --fy: 30px; --r1: 15deg; --r2: -90deg;" />
  <polygon class="confetti" points="80,73 86,85 74,85" fill="#4DEDFF" style="--bx: -50px; --by: -20px; --fx: -70px; --fy: 40px; --r1: -30deg; --r2: 45deg;" />
  <circle class="confetti" cx="80" cy="80" r="4" fill="#9B59B6" style="--bx: -10px; --by: -90px; --fx: -15px; --fy: 10px; --r1: 0deg; --r2: 180deg;" />

  <path class="confetti" d="M75,80 Q80,70 85,80" stroke="#FF8C42" stroke-width="4" stroke-linecap="round" fill="none" style="--bx: 20px; --by: -100px; --fx: 10px; --fy: 20px; --r1: 45deg; --r2: -45deg;" />
  <rect class="confetti" x="76" y="76" width="10" height="10" rx="2" fill="#FF4D94" style="--bx: 40px; --by: -110px; --fx: 45px; --fy: -10px; --r1: 60deg; --r2: 180deg;" />
  <polygon class="confetti" points="80,74 86,86 74,86" fill="#FFC837" style="--bx: 60px; --by: -120px; --fx: 70px; --fy: 0px; --r1: 90deg; --r2: 270deg;" />
  <circle class="confetti" cx="80" cy="80" r="6" fill="#4DEDFF" style="--bx: 80px; --by: -90px; --fx: 90px; --fy: 40px; --r1: 0deg; --r2: 0deg;" />
  <rect class="confetti" x="77" y="77" width="6" height="6" fill="#9B59B6" style="--bx: 95px; --by: -110px; --fx: 110px; --fy: 15px; --r1: 20deg; --r2: 90deg;" />

  <circle class="confetti" cx="80" cy="80" r="7" fill="#FF8C42" style="--bx: 120px; --by: -80px; --fx: 130px; --fy: 30px; --r1: 0deg; --r2: 360deg;" />
  <path class="confetti" d="M74,78 Q82,68 86,82" stroke="#FF4D94" stroke-width="4" stroke-linecap="round" fill="none" style="--bx: 140px; --by: -100px; --fx: 160px; --fy: 10px; --r1: -30deg; --r2: 60deg;" />
  <polygon class="confetti" points="80,72 88,84 72,84" fill="#FFC837" style="--bx: 160px; --by: -60px; --fx: 180px; --fy: 45px; --r1: 45deg; --r2: -45deg;" />
  <rect class="confetti" x="75" y="75" width="9" height="9" fill="#4DEDFF" style="--bx: 180px; --by: -110px; --fx: 200px; --fy: -5px; --r1: 15deg; --r2: 135deg;" />
  <circle class="confetti" cx="80" cy="80" r="4" fill="#9B59B6" style="--bx: 200px; --by: -70px; --fx: 220px; --fy: 35px; --r1: 0deg; --r2: 0deg;" />
  
  <rect class="confetti" x="76" y="76" width="7" height="7" rx="2" fill="#FF4D94" style="--bx: 220px; --by: -90px; --fx: 250px; --fy: 20px; --r1: -10deg; --r2: 120deg;" />
  <path class="confetti" d="M75,80 Q80,70 85,80" stroke="#FFC837" stroke-width="5" stroke-linecap="round" fill="none" style="--bx: 240px; --by: -115px; --fx: 270px; --fy: 5px; --r1: 70deg; --r2: -20deg;" />
  <circle class="confetti" cx="80" cy="80" r="6" fill="#FF8C42" style="--bx: 260px; --by: -60px; --fx: 290px; --fy: 50px; --r1: 0deg; --r2: 0deg;" />
  <polygon class="confetti" points="80,74 85,86 75,86" fill="#4DEDFF" style="--bx: 280px; --by: -100px; --fx: 310px; --fy: 15px; --r1: 40deg; --r2: 200deg;" />
  <rect class="confetti" x="75" y="75" width="10" height="10" fill="#9B59B6" style="--bx: 300px; --by: -80px; --fx: 330px; --fy: 40px; --r1: -45deg; --r2: 45deg;" />

  <circle class="confetti" cx="80" cy="80" r="5" fill="#FF4D94" style="--bx: 320px; --by: -105px; --fx: 360px; --fy: 10px; --r1: 0deg; --r2: 0deg;" />
  <path class="confetti" d="M74,80 Q80,68 86,80" stroke="#4DEDFF" stroke-width="4" stroke-linecap="round" fill="none" style="--bx: 340px; --by: -70px; --fx: 380px; --fy: 45px; --r1: 10deg; --r2: 90deg;" />
  <rect class="confetti" x="77" y="77" width="8" height="8" rx="2" fill="#FFC837" style="--bx: 360px; --by: -110px; --fx: 400px; --fy: 5px; --r1: 25deg; --r2: -60deg;" />
  <polygon class="confetti" points="80,72 87,86 73,86" fill="#FF8C42" style="--bx: 380px; --by: -85px; --fx: 420px; --fy: 30px; --r1: -15deg; --r2: 145deg;" />
  <circle class="confetti" cx="80" cy="80" r="7" fill="#9B59B6" style="--bx: 400px; --by: -60px; --fx: 440px; --fy: 50px; --r1: 0deg; --r2: 0deg;" />

  <rect class="confetti" x="76" y="76" width="6" height="6" fill="#FF4D94" style="--bx: 420px; --by: -100px; --fx: 470px; --fy: 15px; --r1: 60deg; --r2: 180deg;" />
  <path class="confetti" d="M75,80 Q80,70 85,80" stroke="#FFC837" stroke-width="3" stroke-linecap="round" fill="none" style="--bx: 440px; --by: -70px; --fx: 490px; --fy: 40px; --r1: -45deg; --r2: 30deg;" />
  <circle class="confetti" cx="80" cy="80" r="4" fill="#4DEDFF" style="--bx: 460px; --by: -90px; --fx: 510px; --fy: 20px; --r1: 0deg; --r2: 0deg;" />
  <polygon class="confetti" points="80,75 84,83 76,83" fill="#FF8C42" style="--bx: 480px; --by: -60px; --fx: 530px; --fy: 45px; --r1: 30deg; --r2: -30deg;" />
  <rect class="confetti" x="78" y="78" width="5" height="5" fill="#9B59B6" style="--bx: 500px; --by: -80px; --fx: 550px; --fy: 25px; --r1: 45deg; --r2: 135deg;" />
</svg>
