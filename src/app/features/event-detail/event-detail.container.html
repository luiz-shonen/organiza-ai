@if (loading()) {
  <org-page-layout maxWidth="narrow">
    <div class="event-detail__loading" aria-hidden="true">
      <org-skeleton class="event-detail__skeleton-hero" />
      <org-skeleton class="event-detail__skeleton-card" />
      <org-skeleton class="event-detail__skeleton-card" />
    </div>
  </org-page-layout>
} @else if (event(); as event) {
  <org-page-layout maxWidth="narrow" data-testid="event-detail-page">
    <div class="event-detail__stack" data-testid="event-detail">
      <app-event-card
        [event]="event"
        [guestCount]="guestCount()"
        [isOwner]="isOwner()"
        [canEdit]="canEdit()"
        (edit)="editEvent()"
      />

      <app-rsvp-card
        [isConfirmed]="isUserConfirmed()"
        [guestCount]="guestCount()"
        [isLoading]="rsvpLoading()"
        [guestName]="currentGuestName()"
        (confirmRsvp)="onConfirmRsvp()"
        (cancelRsvp)="onCancelRsvp()"
      />

      @if (checklist().length) {
        <app-family-checklist-card
          [rows]="checklist()"
          (boughtToggle)="onToggleBought($event)"
          (removeRow)="onRemoveClaim($event)"
        />
      }

      <app-item-list-card [progress]="progress()" (claim)="onClaimItemById($event)" />

      @if (event.pixKey) {
        <app-pix-card
          [pixKey]="event.pixKey"
          [pixType]="event.pixType"
          [estimatedBudget]="event.estimatedBudget ?? null"
          [guestCount]="guestCount()"
        />
      }
    </div>

    <app-claim-sheet
      [entry]="claimingEntry()"
      [people]="claimPeople()"
      [saving]="claimSaving()"
      (confirm)="onConfirmClaim($event)"
      (closed)="closeClaimSheet()"
    />
  </org-page-layout>
} @else {
  <org-page-layout maxWidth="narrow">
    <org-empty-state
      icon="event"
      title="Evento não encontrado"
      description="O evento que você procura não existe ou foi removido."
    />
  </org-page-layout>
}
