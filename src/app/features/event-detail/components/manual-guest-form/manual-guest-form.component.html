<form novalidate class="manual-guest" (submit)="$event.preventDefault(); submit()">
  <div class="manual-guest__fields">
    <org-text-field
      label="Nome"
      placeholder="Ex: Tia Cida"
      testId="manual-guest-name-input"
      [required]="true"
      [maxLength]="nameMaxLength"
      [error]="nameError()"
      [(value)]="name"
    />
    <org-text-field
      label="WhatsApp (opcional)"
      type="tel"
      inputMode="numeric"
      placeholder="(11) 98888-1111"
      testId="manual-guest-phone-input"
      [mask]="maskPhone"
      [error]="phoneError()"
      [(value)]="phone"
    />
  </div>

  <!-- The same two panels as "Editar presença"; the relatives stay only on this event. -->
  <div data-testid="manual-guest-family">
    <app-family-selector
      owner="other"
      [members]="relatives()"
      [selectedIds]="selectedRelativeIds()"
      (toggleMember)="onToggleRelative($event)"
      (selectAll)="onSelectAllRelatives($event)"
      (addInlineMember)="onAddRelative($event)"
      (updateMember)="onUpdateRelative($event)"
      (removeMember)="onRemoveRelative($event)"
    />
  </div>

  <app-companion-selector
    emptyText="Ninguém vai junto ainda."
    [names]="companionNames()"
    [selected]="selectedCompanions()"
    (toggleCompanion)="onToggleCompanion($event)"
    (add)="onAddCompanion($event)"
  />

  @if (santa(); as santa) {
    <section
      class="manual-guest__santa"
      data-testid="manual-guest-santa"
      aria-labelledby="manual-guest-santa-title"
    >
      <h3 id="manual-guest-santa-title" class="manual-guest__title">Amigo oculto</h3>
      @if (santa.rules) {
        <p class="manual-guest__santa-rules" [textContent]="santa.rules"></p>
      }
      <p class="manual-guest__hint">Quem vai participar do sorteio?</p>
      @for (person of santaPeople(); track person.key; let i = $index) {
        <div class="manual-guest__santa-person">
          <org-checkbox
            [label]="person.label"
            [testId]="'manual-guest-santa-person-' + i"
            [checked]="isSantaChecked(person.key)"
            (checkedChange)="setSantaChecked(person.key, $event)"
          />
          @if (person.key !== 'self' && isSantaChecked(person.key)) {
            <org-text-field
              type="tel"
              placeholder="(11) 99999-9999"
              [hint]="santaPhoneHint()"
              [label]="'WhatsApp de ' + person.name"
              [mask]="maskPhone"
              [testId]="'manual-guest-santa-phone-' + i"
              [error]="santaPhoneError(person.key)"
              [value]="santaPhones()[person.key] ?? ''"
              (valueChange)="setSantaPhone(person.key, $event)"
            />
          }
          @if (santa.giftOptions && isSantaChecked(person.key)) {
            <app-gift-options-field
              hint=""
              [label]="santaGiftLabel(person)"
              [testIdPrefix]="'manual-guest-santa-' + i"
              [max]="santa.maxGiftOptions"
              [gifts]="santaGifts()[person.key] ?? []"
              (giftsChange)="setSantaGifts(person.key, $event)"
            />
          }
        </div>
      }
    </section>
  }

  <div class="manual-guest__actions">
    <org-button
      variant="text"
      label="Cancelar"
      testId="manual-guest-cancel-btn"
      (pressed)="cancelled.emit()"
    />
    <org-button
      type="submit"
      variant="primary"
      testId="manual-guest-submit-btn"
      [gradient]="false"
      [label]="submitLabel()"
      [loading]="saving()"
    />
  </div>
</form>
