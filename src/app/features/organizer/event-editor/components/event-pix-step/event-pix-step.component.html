<form [formGroup]="form()" class="event-step" id="pix-form" data-testid="event-editor-step-4">
  <org-surface variant="card">
    <div class="event-step__card">
      <org-card-header
        heading="Pagamento por Pix"
        subheading="Para receber contribuições dos convidados"
      />
      <org-text-field
        label="Chave Pix (opcional)"
        placeholder="CPF, e-mail ou chave aleatória"
        hint="Deixe em branco se o evento não tiver Pix."
        [maxLength]="77"
        [error]="fieldError(form().controls.pixKey, '')"
        formControlName="pixKey"
        testId="event-pix-input"
      />
      <org-textarea-field
        label="Para que é o Pix (opcional)"
        placeholder="Ex: rachar os custos da festa, comprar bebidas a mais, doação para o abrigo do bairro."
        hint="Aparece para os convidados junto com a chave."
        [rows]="3"
        [maxLength]="purposeMax"
        formControlName="pixPurpose"
        testId="event-pix-purpose-input"
      />
    </div>
  </org-surface>
  @if (canSave() && missingSteps().length) {
    <p class="event-step__missing" role="status" data-testid="missing-steps">
      Para salvar, complete: {{ missingSteps().join(', ') }}.
    </p>
  }
  <div class="event-step__actions">
    <org-button label="Voltar" variant="text" (pressed)="back.emit()" />
    @if (canSave()) {
      <org-button
        testId="event-save-btn"
        [label]="isEditing() ? 'Salvar alterações' : 'Criar evento'"
        [gradient]="false"
        [disabled]="missingSteps().length > 0 || saving()"
        [loading]="saving()"
        (pressed)="save.emit()"
      />
    } @else {
      <p class="event-step__locked-note">
        <org-icon name="lock" size="sm" />
        Apenas o organizador principal pode salvar alterações principais.
      </p>
    }
  </div>
</form>
