<section
  class="org-banner"
  [class]="'org-banner org-banner--' + variant()"
  data-testid="org-banner"
  role="alert"
>
  @if (icon(); as icon) {
    <org-icon class="org-banner__icon" [name]="icon" color="currentColor" />
  }
  <div class="org-banner__body">
    <p class="org-banner__message">{{ message() }}</p>
    <!-- An optional action ("Descartar"), on its own line under the message. -->
    <div class="org-banner__actions"><ng-content /></div>
  </div>
</section>
