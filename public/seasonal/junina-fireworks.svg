<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="burstGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5C0" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FFC837" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF8C42" stop-opacity="0"/>
    </radialGradient>
    <style>
      .firework-group { transform-origin: 100px 100px; animation: fireworkRotate 6s ease-in-out infinite alternate; }
      .spark-dot { animation: sparkPulse 2s ease-in-out infinite alternate; }
      @keyframes fireworkRotate {
        0%   { transform: scale(0.85) rotate(-10deg); opacity: 0.7; }
        100% { transform: scale(1.15) rotate(15deg);  opacity: 1; }
      }
      @keyframes sparkPulse {
        0%   { opacity: 0.4; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <g class="firework-group">
    <!-- Central glow -->
    <circle cx="100" cy="100" r="16" fill="url(#burstGlow)"/>

    <!-- Burst rays -->
    <g stroke-linecap="round">
      <line x1="100" y1="100" x2="100" y2="30" stroke="#00D2FF" stroke-width="2.5"/>
      <line x1="100" y1="100" x2="100" y2="170" stroke="#FF4D94" stroke-width="2.5"/>
      <line x1="100" y1="100" x2="30" y2="100" stroke="#FFC837" stroke-width="2.5"/>
      <line x1="100" y1="100" x2="170" y2="100" stroke="#2ECC71" stroke-width="2.5"/>
      <line x1="100" y1="100" x2="50" y2="50" stroke="#FF8C42" stroke-width="2"/>
      <line x1="100" y1="100" x2="150" y2="150" stroke="#4DEDFF" stroke-width="2"/>
      <line x1="100" y1="100" x2="150" y2="50" stroke="#FF6B6B" stroke-width="2"/>
      <line x1="100" y1="100" x2="50" y2="150" stroke="#FFC837" stroke-width="2"/>
    </g>

    <!-- Sparkle tips -->
    <circle cx="100" cy="28" r="3" fill="#00D2FF" class="spark-dot"/>
    <circle cx="100" cy="172" r="3" fill="#FF4D94" class="spark-dot"/>
    <circle cx="28" cy="100" r="3" fill="#FFC837" class="spark-dot"/>
    <circle cx="172" cy="100" r="3" fill="#2ECC71" class="spark-dot"/>
    <circle cx="48" cy="48" r="2.5" fill="#FF8C42" class="spark-dot"/>
    <circle cx="152" cy="152" r="2.5" fill="#4DEDFF" class="spark-dot"/>
    <circle cx="152" cy="48" r="2.5" fill="#FF6B6B" class="spark-dot"/>
    <circle cx="48" cy="152" r="2.5" fill="#FFC837" class="spark-dot"/>

    <!-- Center core -->
    <circle cx="100" cy="100" r="5" fill="#FFF5C0"/>
  </g>
</svg>
