<mat-form-field appearance="outline" class="org-time-field">
  <mat-label>{{ label() }}</mat-label>
  <input matInput inputmode="numeric" maxlength="5" placeholder="HH:mm" [disabled]="disabled()" [value]="value()" (blur)="markTouched()" (input)="updateValue($event)" />
  <span class="org-time-field__controls" matTextSuffix>
    <button mat-icon-button type="button" aria-label="Voltar horário" [disabled]="disabled()" (click)="decrement()">−</button>
    <button mat-icon-button type="button" aria-label="Avançar horário" [disabled]="disabled()" (click)="increment()">+</button>
  </span>
</mat-form-field>
