<org-page-layout maxWidth="default" data-testid="event-editor-page">
  @if (loading()) {
    <org-page-header title="Carregando..." />
    <div class="editor__grid" aria-hidden="true">
      <div class="editor__col">
        <org-surface variant="card">
          <div class="editor__skeleton-form">
            <org-skeleton class="editor__skeleton-input" />
            <org-skeleton class="editor__skeleton-textarea" />
            <org-skeleton class="editor__skeleton-input" />
            <org-skeleton class="editor__skeleton-btn" />
          </div>
        </org-surface>
      </div>
    </div>
  } @else {
    <org-page-header [title]="isEditing() ? 'Editar evento' : 'Novo evento'">
      @if (isEditing() && isOwner()) {
        <div orgPageHeaderActions class="editor__header-actions">
          <org-button
            label="Colaboradores"
            icon="group_add"
            variant="secondary"
            [compact]="true"
            (pressed)="openCollaboratorsDialog()"
          />
          @if (currentEvent()?.status !== 'cancelled') {
            <org-button
              label="Cancelar evento"
              variant="danger-text"
              icon="cancel"
              testId="cancel-event-btn"
              [compact]="true"
              (pressed)="cancelEvent()"
            />
          }
        </div>
      }
    </org-page-header>

    @if (isEditing() && !isOwner()) {
      <org-banner
        variant="info"
        icon="info"
        class="editor__collab-banner"
        role="status"
        aria-label="Permissões de colaborador"
        [message]="'Modo colaborador: você pode gerenciar a lista de itens e ver os convidados. As informações principais só podem ser alteradas pelo organizador.'"
      />
    }

    <div class="editor__grid" [class.editor__grid--single]="!isEditing()">
      <div class="editor__col" data-testid="event-step-progress">
        <org-stepper
          #stepper
          ariaLabel="Etapas de criação do evento"
          [linear]="!isEditing()"
          [compact]="true"
          (selectionChange)="activeStepIndex.set($event)"
        >
          <org-step [label]="stepLabels[0]" [stepControl]="basicInfoForm">
            <app-event-basic-info-step
              [form]="basicInfoForm"
              [categories]="categories"
              [minDate]="minDate"
              (next)="stepper.next()"
              (cancelled)="cancelEditing()"
            />
          </org-step>

          <org-step [label]="stepLabels[1]" [stepControl]="addressForm">
            <app-event-address-step
              [form]="addressForm"
              (cepInput)="formatCep($event)"
              (back)="stepper.previous()"
              (next)="stepper.next()"
            />
          </org-step>

          <org-step [label]="stepLabels[2]">
            <app-event-items-step
              [items]="stepItems()"
              (add)="addItem($event)"
              (update)="updateItem($event)"
              (remove)="removeItem($event)"
              (back)="stepper.previous()"
              (next)="stepper.next()"
            />
          </org-step>

          <org-step [label]="stepLabels[3]" [stepControl]="pixForm">
            <app-event-pix-step
              [form]="pixForm"
              [canSave]="isOwner()"
              [isEditing]="isEditing()"
              [saving]="saving()"
              [missingSteps]="missingSteps()"
              (back)="stepper.previous()"
              (save)="saveEvent()"
            />
          </org-step>
        </org-stepper>
      </div>

      @if (isEditing()) {
        <div class="editor__col">
          <app-share-panel
            [eventUrl]="eventUrl()"
            [eventTitle]="basicInfoForm.controls.title.value"
            [eventDate]="currentEvent()?.date ?? null"
            [eventLocation]="currentEvent()?.location ?? null"
          />
          <app-event-guests-card
            class="print-section"
            [guests]="guests()"
            [declines]="declines()"
            (exportCsv)="exportToCsv()"
            (print)="printList()"
          />
        </div>
      }
    </div>
  }
</org-page-layout>
