<org-surface variant="card" data-testid="secret-santa-roster">
  <section class="roster" aria-labelledby="roster-title">
    <org-card-header id="roster-title" heading="Amigo oculto" [subheading]="subheading()" />
    <ul class="roster__list">
      @for (entry of entries(); track entry.id) {
        <li class="roster__person" data-testid="secret-santa-roster-person">
          <p class="roster__name">{{ entry.name }}</p>
          @if (giftOptions()) {
            @if (entry.giftOptions.length) {
              <ul class="roster__gifts" [attr.aria-label]="'Ideias de presente para ' + entry.name">
                @for (gift of entry.giftOptions; track $index) {
                  <li class="roster__gift">
                    <org-icon name="redeem" size="sm" color="currentColor" />
                    {{ gift }}
                  </li>
                }
              </ul>
            } @else {
              <p class="roster__none">Sem ideias de presente ainda</p>
            }
          }
        </li>
      }
    </ul>
  </section>
</org-surface>
