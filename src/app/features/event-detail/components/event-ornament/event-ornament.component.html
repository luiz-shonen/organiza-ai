<org-surface
  class="ornament-frame"
  variant="card"
  testId="event-ornament"
  [flush]="true"
  [fill]="true"
>
  <div class="ornament">
    <svg
      class="ornament__scene"
      viewBox="0 0 600 240"
      preserveAspectRatio="xMidYMax meet"
      xmlns="http://www.w3.org/2000/svg"
      focusable="false"
    >
      <!-- Bunting across the top -->
      <path class="ornament__string" d="M-400 18 L0 18 Q300 70 600 18 L1000 18" />
      @for (flag of flags; track flag.x) {
        <path
          [class]="'ornament__flag ornament__flag--' + flag.tone"
          [attr.d]="
            'M' +
            (flag.x - 14) +
            ' ' +
            flag.y +
            ' L' +
            (flag.x + 14) +
            ' ' +
            flag.y +
            ' L' +
            flag.x +
            ' ' +
            (flag.y + 30) +
            ' Z'
          "
          [style.animation-delay]="flag.delay"
        />
      }

      <!-- Soft hill -->
      <path
        class="ornament__hill"
        d="M-400 260 L-400 200 Q-100 170 0 206 Q150 178 300 196 Q450 214 600 190 Q750 170 1000 200 L1000 260 Z"
      />

      <!-- Balloons, left -->
      <g class="ornament__balloon" style="animation-delay: 0s">
        <path class="ornament__line" d="M96 158 Q90 182 100 206" />
        <ellipse class="ornament__fill--primary" cx="96" cy="128" rx="24" ry="30" />
        <path class="ornament__fill--primary" d="M91 157 L101 157 L96 151 Z" />
        <ellipse class="ornament__shine" cx="87" cy="116" rx="5" ry="9" />
      </g>
      <g class="ornament__balloon" style="animation-delay: -1.4s">
        <path class="ornament__line" d="M140 140 Q146 172 104 206" />
        <ellipse class="ornament__fill--tertiary" cx="140" cy="110" rx="21" ry="27" />
        <path class="ornament__fill--tertiary" d="M135 137 L145 137 L140 131 Z" />
        <ellipse class="ornament__shine" cx="132" cy="99" rx="4" ry="8" />
      </g>

      <!-- Gift -->
      <g class="ornament__gift">
        <rect class="ornament__fill--primary" x="262" y="150" width="76" height="52" rx="6" />
        <rect class="ornament__fill--secondary" x="292" y="150" width="16" height="52" />
        <g class="ornament__lid">
          <rect
            class="ornament__fill--primary-deep"
            x="254"
            y="134"
            width="92"
            height="20"
            rx="5"
          />
          <rect class="ornament__fill--secondary" x="292" y="134" width="16" height="20" />
          <path
            class="ornament__bow"
            d="M300 134 C282 110 268 128 300 134 C332 128 318 110 300 134 Z"
          />
        </g>
      </g>

      <!-- Balloons, right -->
      <g class="ornament__balloon" style="animation-delay: -0.7s">
        <path class="ornament__line" d="M468 146 Q474 178 488 206" />
        <ellipse class="ornament__fill--secondary" cx="468" cy="116" rx="22" ry="28" />
        <path class="ornament__fill--secondary" d="M463 144 L473 144 L468 138 Z" />
        <ellipse class="ornament__shine" cx="460" cy="105" rx="4" ry="8" />
      </g>
      <g class="ornament__balloon" style="animation-delay: -2.1s">
        <path class="ornament__line" d="M512 160 Q506 186 490 206" />
        <ellipse class="ornament__fill--success" cx="512" cy="132" rx="20" ry="26" />
        <path class="ornament__fill--success" d="M507 158 L517 158 L512 152 Z" />
        <ellipse class="ornament__shine" cx="505" cy="122" rx="4" ry="7" />
      </g>

      <!-- Confetti and sparkles -->
      @for (bit of confetti; track $index) {
        <rect
          [class]="'ornament__confetti ornament__fill--' + bit.tone"
          [attr.x]="bit.x"
          [attr.y]="bit.y"
          width="6"
          height="10"
          rx="1.5"
          [style.animation-delay]="bit.delay"
        />
      }
      @for (star of sparkles; track $index) {
        <path
          class="ornament__sparkle"
          [attr.d]="
            'M' +
            star.x +
            ' ' +
            (star.y - 8) +
            ' L' +
            (star.x + 2) +
            ' ' +
            (star.y - 2) +
            ' L' +
            (star.x + 8) +
            ' ' +
            star.y +
            ' L' +
            (star.x + 2) +
            ' ' +
            (star.y + 2) +
            ' L' +
            star.x +
            ' ' +
            (star.y + 8) +
            ' L' +
            (star.x - 2) +
            ' ' +
            (star.y + 2) +
            ' L' +
            (star.x - 8) +
            ' ' +
            star.y +
            ' L' +
            (star.x - 2) +
            ' ' +
            (star.y - 2) +
            ' Z'
          "
          [style.animation-delay]="star.delay"
        />
      }
    </svg>
  </div>
</org-surface>
