<org-page-layout maxWidth="narrow" data-testid="profile-page">
  <org-page-header title="Meu perfil" subtitle="Gerencie suas informações e seus familiares." />

  @if (loading()) {
    <org-loading-state label="Carregando perfil..." />
  } @else {
    @if (userProfile(); as profile) {
      <div class="profile-container__content">
        <section class="profile-container__section" aria-label="Dados do perfil">
          <app-profile-info-card [user]="profile" (updateName)="onUpdateName($event)" />
        </section>

        <section class="profile-container__section" aria-label="Preferências da conta">
          <app-profile-preferences-card
            [themeMode]="themeMode()"
            [isSuperAdmin]="isSuperAdmin()"
            (themeChange)="changeTheme($event)"
            (openAdmin)="openRoute('/admin')"
            (openDesignSystem)="openRoute('/design-system')"
            (logout)="logout()"
          />
        </section>

        <section class="profile-container__section" aria-labelledby="family-roster-heading">
          <app-family-roster-manager
            [members]="familyMembers()"
            [isAdding]="addingFamilyMember()"
            (addMember)="onAddFamilyMember($event)"
            (removeMember)="onRemoveFamilyMember($event)"
          />
        </section>
      </div>
    }
  }
</org-page-layout>
