name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality & Build Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint TypeScript & Templates (ESLint)
        run: npm run lint

      - name: Lint Stylesheets (Stylelint)
        run: npm run lint:styles

      - name: Validate Design System Contracts
        run: npm run lint:contracts

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Build Application
        run: npm run build
