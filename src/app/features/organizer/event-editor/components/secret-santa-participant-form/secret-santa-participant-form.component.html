<form novalidate class="santa-form" (submit)="$event.preventDefault(); submit()">
  <div class="santa-form__fields">
    <org-text-field
      label="Nome"
      placeholder="Ex: Jéssica"
      [testId]="testIdPrefix() + '-name-input'"
      [required]="true"
      [maxLength]="nameMaxLength"
      [error]="nameError()"
      [suggestions]="nameSuggestions()"
      [(value)]="name"
      (suggestionPicked)="pickPerson($event)"
    />
    <org-text-field
      label="Telefone (WhatsApp)"
      type="tel"
      inputMode="numeric"
      placeholder="(11) 98888-1111"
      hint="Para enviar o link do sorteio."
      [testId]="testIdPrefix() + '-phone-input'"
      [mask]="maskPhone"
      [error]="phoneError()"
      [(value)]="phone"
    />
  </div>

  @if (showGiftOptions()) {
    <app-gift-options-field
      [testIdPrefix]="testIdPrefix()"
      [max]="maxGiftOptions()"
      [(gifts)]="gifts"
    />
  }

  <div class="santa-form__actions">
    @if (cancelLabel(); as cancelLabel) {
      <org-button
        variant="text"
        [label]="cancelLabel"
        [testId]="testIdPrefix() + '-cancel-btn'"
        (pressed)="cancelled.emit()"
      />
    }
    <org-button
      type="submit"
      [class.santa-form__submit--full]="!cancelLabel()"
      [variant]="cancelLabel() ? 'primary' : 'secondary'"
      [gradient]="false"
      [label]="submitLabel()"
      [loading]="saving()"
      [fullWidth]="!cancelLabel()"
      [testId]="testIdPrefix() + '-submit-btn'"
    />
  </div>
</form>
