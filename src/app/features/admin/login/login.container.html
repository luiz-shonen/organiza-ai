

<main class="login">
  <div class="login__header">
    <img src="icons/logo.svg" alt="Organiza AI" style="height: 96px;" />
    <br>
  </div>

  <div class="login__card glass-card">
    

    @if (errorMessage(); as error) {
      <div class="login__error">
        <mat-icon>error</mat-icon>
        {{ error }}
      </div>
    }

    <form id="login-form" [formGroup]="form" (ngSubmit)="submit()" class="login__form" action="#" method="post">
      
      <mat-form-field appearance="outline" class="login__input-field">
        <mat-label>E-mail</mat-label>
        <mat-icon matPrefix>email</mat-icon>
        <input 
          matInput
          id="username"
          formControlName="email" name="username" type="email" autocomplete="username" required
        />
        @if (form.controls.email.hasError('required')) {
          <mat-error>E-mail é obrigatório</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="login__input-field">
        <mat-label>Senha</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input 
          matInput
          id="password"
          formControlName="password" name="password" [type]="hidePassword() ? 'password' : 'text'" autocomplete="current-password" required
        />
        <button 
          mat-icon-button
          matSuffix
          type="button" 
          (click)="hidePassword.set(!hidePassword())"
          [attr.aria-label]="'Esconder senha'"
        >
          <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        @if (form.controls.password.hasError('required')) {
          <mat-error>Senha é obrigatória</mat-error>
        }
      </mat-form-field>

      <button 
        type="submit"
        [disabled]="form.invalid || loading()"
        class="btn-primary-org login__submit"
      >
        @if (loading()) {
          <mat-spinner diameter="20" color="accent"></mat-spinner>
        } @else {
          Entrar ou Cadastrar
        }
      </button>

    </form>

    <div class="login__divider">
      <span class="login__divider-text">OU</span>
    </div>

    <button
      type="button"
      [disabled]="loading()"
      (click)="loginWithGoogle()"
      class="login__google"
    >
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="login__google-icon" />
      Entrar com Google
    </button>

  </div>
</main>
