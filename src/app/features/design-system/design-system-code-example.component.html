<figure class="ds-code">
  <figcaption class="ds-code__header">
    <span class="ds-code__label">{{ label() }}</span>
    <org-copy-button
      label="Copiar"
      copiedMessage="Código copiado!"
      variant="text"
      [compact]="true"
      [gradient]="false"
      [value]="code()"
    />
  </figcaption>
  <pre class="ds-code__body" tabindex="0"><code>{{ code() }}</code></pre>
</figure>
