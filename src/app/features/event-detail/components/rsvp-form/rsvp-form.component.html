    <div class="rsvp">
      <h2 class="rsvp__title">
        Confirme sua Presença
      </h2>
      
      <div class="glass-card rsvp__card">
        <!-- Optional Tabs (Visual only for now) -->
        <div class="rsvp__tabs">
          <button 
            type="button"
            class="rsvp__tab" 
            [class.rsvp__tab--active]="selectedMode() === 'solo'"
            (click)="setMode('solo')"
          >
            Apenas Eu
          </button>
          <button 
            type="button"
            class="rsvp__tab"
            [class.rsvp__tab--active]="selectedMode() === 'family'"
            (click)="setMode('family')"
          >
            Família
          </button>
        </div>

        <form #f="ngForm" (ngSubmit)="onSubmit(f)" class="rsvp__form">
          
          <div class="rsvp__input-group">
            <input 
              name="name" ngModel required 
              class="glass-input rsvp__input"
              placeholder="Nome Completo (Ex: João Silva)" 
            />
          </div>

          <div class="rsvp__input-group">
            <input 
              name="phone" ngModel required 
              class="glass-input rsvp__input"
              placeholder="WhatsApp (Ex: 11999999999)" 
            />
          </div>

          <!-- Action -->
          <div class="rsvp__actions">
            <button 
              type="submit"
              [disabled]="f.invalid || isSubmitting()"
              class="rsvp__submit"
            >
              @if (isSubmitting()) {
                <mat-spinner diameter="20" color="accent"></mat-spinner>
              } @else {
                Confirmar <mat-icon class="rsvp__submit-icon">check_circle</mat-icon>
              }
            </button>
          </div>
        </form>
      </div>
    </div>
