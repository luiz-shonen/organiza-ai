<mat-form-field appearance="outline" class="org-date-field">
  <mat-label>{{ label() }}</mat-label>
  <input matInput [matDatepicker]="picker" [value]="value()" (dateChange)="value.set($event.value)" />
  <mat-datepicker-toggle matIconSuffix [for]="picker" />
  <mat-datepicker #picker />
</mat-form-field>
