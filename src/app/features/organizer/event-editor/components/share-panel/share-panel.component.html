@if (eventUrl()) {
  <org-surface variant="card">
    <article class="share-panel">
      <org-card-header
        icon="qr_code_2"
        tone="tertiary"
        heading="Compartilhar"
        subheading="Convide seus amigos!"
      />
      <div class="share-panel__qr-container">
        <canvas #qrCanvas class="share-panel__qr" aria-label="QR Code do evento"></canvas>
      </div>

      <div class="share-panel__link">
        <code class="share-panel__url">{{ eventUrl() }}</code>
      </div>
      <footer class="share-panel__actions">
        <org-copy-button
          label="Copiar link"
          copiedMessage="Link copiado!"
          variant="secondary"
          [gradient]="false"
          [value]="eventUrl()"
        />
        <org-button
          label="WhatsApp"
          icon="share"
          [gradient]="false"
          class="share-panel__whatsapp-btn"
          (pressed)="shareWhatsApp()"
        />
      </footer>
    </article>
  </org-surface>
}
