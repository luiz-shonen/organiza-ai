name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality & Build Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_code_changes: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Paths Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Lint TypeScript & Templates (ESLint)
        if: steps.filter.outputs.code == 'true'
        run: npm run lint

      - name: Lint Stylesheets (Stylelint)
        if: steps.filter.outputs.code == 'true'
        run: npm run lint:styles

      - name: Validate Design System Contracts
        if: steps.filter.outputs.code == 'true'
        run: npm run lint:contracts

      - name: Run Script Unit Tests
        if: steps.filter.outputs.code == 'true'
        run: npm run test:scripts

      - name: Build Application
        if: steps.filter.outputs.code == 'true'
        run: npm run build

  e2e:
    name: Playwright E2E Tests
    needs: quality
    if: needs.quality.outputs.has_code_changes == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers & System Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright System Dependencies (Cached Browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e:ci

      - name: Upload Test Report & Failure Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  gemini-review:
    name: Gemini Code Review
    needs: [quality, e2e]
    if: github.event_name == 'pull_request' && github.event.action == 'opened' && !cancelled() && needs.quality.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/gemini-pr-review.mjs
