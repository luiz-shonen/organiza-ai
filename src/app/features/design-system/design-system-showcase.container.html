<org-page-layout maxWidth="wide" data-testid="design-system-page">
  <org-page-header
    title="Design "
    highlight="system"
    subtitle="Os componentes Org* e os tokens --org-* que todas as telas usam, com exemplos prontos para copiar."
  />

  <div class="ds-page">
    <app-design-system-foundations
      [tokenValues]="tokenValues()"
      [activeSeasonalTheme]="activeSeasonalTheme()"
      [dark]="theme.isDark()"
      (seasonalThemeChange)="setSeasonalTheme($event)"
      (darkChange)="setDark($event)"
    />
    <app-design-system-actions />
    <app-design-system-forms />
    <app-design-system-navigation [phone]="phone()" />
    <app-design-system-display />
    <app-design-system-feedback
      [dialogAnswer]="dialogAnswer()"
      (toastRequested)="showToast($event)"
      (dialogRequested)="openDialog($event)"
    />
  </div>
</org-page-layout>
