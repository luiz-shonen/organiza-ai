    @if (event(); as ev) {
      <div class="event-card">
        <!-- Hero Event Image -->
        <div class="event-card__hero">
          <img
            alt="Capa do Evento"
            class="event-card__hero-img"
            src="https://images.unsplash.com/photo-1533174000273-e18f142b4d99?auto=format&fit=crop&w=1200&q=80"
          />
          <!-- Overlay Gradient for Text Legibility -->
          <div class="event-card__hero-overlay"></div>
          
          <!-- Event Title Floating over Image -->
          <div class="event-card__hero-content">
            <span class="event-card__badge">
              Festa & Celebração
            </span>
            <h1 class="event-card__title">
              {{ ev.title }}
            </h1>
          </div>
        </div>

        <!-- Event Details Card -->
        <div class="event-card__details-wrapper">
          <div class="glass-card event-card__details-card">
            <!-- Date & Time -->
            <div class="event-card__info-row">
              <div class="event-card__icon-box event-card__icon-box--primary">
                <span class="event-card__icon-box-month">{{ ev.date | date: 'MMM' }}</span>
                <span class="event-card__icon-box-day">{{ ev.date | date: 'dd' }}</span>
              </div>
              <div class="event-card__info-text">
                <p class="event-card__info-title">{{ ev.date | date: 'EEEE, HH:mm' }}</p>
                <p class="event-card__info-subtitle">Adicionar ao calendário</p>
              </div>
            </div>
            
            <hr class="event-card__divider" />
            
            <!-- Location -->
            <div class="event-card__info-row">
              <div class="event-card__icon-box event-card__icon-box--secondary">
                <mat-icon>location_on</mat-icon>
              </div>
              <div class="event-card__info-text">
                <p class="event-card__info-title">{{ ev.location }}</p>
                <p class="event-card__info-subtitle">{{ ev.description }}</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Hosted By -->
        <div class="event-card__host-section">
          <p class="event-card__host-label">
            Organizado Por
          </p>
          <div class="event-card__host-row">
            <div class="event-card__host-avatar">
              <mat-icon class="event-card__host-icon">person</mat-icon>
            </div>
            <div class="event-card__host-text">
              <p class="event-card__host-name">Você (Admin)</p>
              <p class="event-card__host-role">Organiza AI</p>
            </div>
            <button
              mat-icon-button
              class="event-card__chat-btn"
            >
              <mat-icon>chat</mat-icon>
            </button>
          </div>
        </div>
      </div>
    }
