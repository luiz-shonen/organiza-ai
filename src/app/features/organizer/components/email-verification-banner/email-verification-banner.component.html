<aside class="org-email-banner" role="alert" aria-label="Aviso de verificação de e-mail">
  <div class="org-email-banner__main">
    <mat-icon class="org-email-banner__icon" aria-hidden="true">mark_email_unread</mat-icon>
    <div class="org-email-banner__content">
      <p class="org-email-banner__text">
        Um e-mail de confirmação foi enviado para <strong class="org-email-banner__email">{{ email() }}</strong>. Por favor, verifique sua caixa de entrada para garantir acesso completo.
      </p>
    </div>
  </div>
  <div class="org-email-banner__actions">
    <button
      mat-stroked-button
      type="button"
      class="org-email-banner__button"
      [disabled]="resendCooldown() > 0"
      (click)="onResend()"
      aria-label="Reenviar e-mail de confirmação"
    >
      <mat-icon aria-hidden="true">send</mat-icon>
      @if (resendCooldown() > 0) {
        <span>Reenviar em {{ resendCooldown() }}s</span>
      } @else {
        <span>Reenviar Confirmação</span>
      }
    </button>
  </div>
</aside>
