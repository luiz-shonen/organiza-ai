<mat-form-field appearance="outline" class="org-textarea-field">
  <mat-label>{{ label() }}</mat-label>
  <textarea
    matInput
    [attr.data-testid]="testId() || null"
    [attr.maxlength]="maxLength()"
    [attr.minlength]="minLength()"
    [disabled]="isDisabled()"
    [placeholder]="placeholder()"
    [required]="required()"
    [rows]="rows()"
    [value]="value()"
    (blur)="markTouched()"
    (input)="updateValue($event)"
  ></textarea>
  @if (hint() && !error()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
  @if (counterLabel() && !error()) {
    <mat-hint align="end">{{ counterLabel() }}</mat-hint>
  }
</mat-form-field>
@if (error()) {
  <p class="org-textarea-field__error" role="alert">{{ error() }}</p>
}
