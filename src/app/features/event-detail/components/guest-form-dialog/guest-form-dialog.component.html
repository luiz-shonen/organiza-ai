<div class="guest-dialog" data-testid="rsvp-dialog">
  <h2 mat-dialog-title class="guest-dialog__title">
    <mat-icon class="guest-dialog__icon" aria-hidden="true">person_add</mat-icon>
    Confirme seus dados
  </h2>

  <mat-dialog-content class="guest-dialog__content">
    <form [formGroup]="form" class="guest-dialog__form" id="guest-form">
      <org-text-field class="guest-dialog__field" label="Seu nome" placeholder="Ex: Maria Silva" formControlName="name" testId="rsvp-name-input" [required]="true" [error]="form.controls.name.hasError('required') ? 'Nome é obrigatório' : ''" />

      <org-text-field class="guest-dialog__field" label="WhatsApp / Telefone" type="tel" placeholder="(11) 99999-9999" formControlName="phone" testId="rsvp-phone-input" [required]="true" [error]="form.controls.phone.hasError('required') ? 'Telefone é obrigatório' : form.controls.phone.hasError('minlength') ? 'Mínimo 10 dígitos' : ''" />

      <org-text-field class="guest-dialog__field" label="Outros acompanhantes" type="number" placeholder="0" hint="Amigos ou acompanhantes fora da família" formControlName="companionsCount" testId="rsvp-companions-input" />

      <div class="guest-dialog__family-section" data-testid="family-selector">
        <app-family-selector
          [members]="familyMembers()"
          [selectedIds]="selectedFamilyMemberIds()"
          [isAddingInline]="isAddingInline()"
          (toggleMember)="onToggleFamilyMember($event)"
          (selectAll)="onSelectAllFamily($event)"
          (addInlineMember)="onAddInlineFamilyMember($event)"
        />
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="guest-dialog__actions">
    <org-button
      label="Cancelar"
      variant="text"
      [gradient]="false"
      data-testid="rsvp-cancel-btn"
      (pressed)="cancel()"
    />
    <org-button
      label="Confirmar"
      [disabled]="form.invalid"
      data-testid="rsvp-confirm-btn"
      (pressed)="submit()"
    />
  </mat-dialog-actions>
</div>
