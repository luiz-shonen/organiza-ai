<span
  class="org-badge"
  [class.org-badge--default]="variant() === 'default'"
  [class.org-badge--primary]="variant() === 'primary'"
  [class.org-badge--success]="variant() === 'success'"
  [class.org-badge--warning]="variant() === 'warning'"
  [class.org-badge--danger]="variant() === 'danger'"
  [class.org-badge--gradient]="gradient()"
>
  @if (icon(); as badgeIcon) {
    <org-icon [name]="badgeIcon" size="sm" />
  }
  {{ label() }}
</span>
