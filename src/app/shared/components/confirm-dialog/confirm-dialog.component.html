<div class="confirm-dialog" data-testid="confirm-dialog">
  <h2 mat-dialog-title class="confirm-dialog__title" data-testid="confirm-dialog-title">{{ data.title }}</h2>
  <mat-dialog-content class="confirm-dialog__content">
    <p class="confirm-dialog__message" data-testid="confirm-dialog-message">{{ data.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="confirm-dialog__actions">
    <button mat-button mat-dialog-close class="confirm-dialog__cancel-btn" data-testid="confirm-dialog-cancel-btn">
      {{ data.cancelLabel || 'Cancelar' }}
    </button>
    <button mat-flat-button color="warn" [mat-dialog-close]="true" class="confirm-dialog__confirm-btn" data-testid="confirm-dialog-confirm-btn">
      {{ data.confirmLabel || 'Confirmar' }}
    </button>
  </mat-dialog-actions>
</div>
