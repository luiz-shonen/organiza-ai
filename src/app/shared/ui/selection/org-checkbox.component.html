<mat-checkbox
  class="org-checkbox"
  [attr.aria-label]="ariaLabel()"
  [attr.data-testid]="testId() || null"
  [checked]="checked()"
  [disabled]="disabled()"
  [indeterminate]="indeterminate()"
  (change)="updateChecked($event.checked)"
>
  @if (label()) {
    {{ label() }}
  } @else {
    <ng-content />
  }
</mat-checkbox>
