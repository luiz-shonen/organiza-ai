<mat-stepper
  class="org-stepper"
  [class.org-stepper--compact]="compact()"
  [attr.aria-label]="ariaLabel()"
  [linear]="linear()"
  [orientation]="orientation()"
  [selectedIndex]="selectedIndex()"
  (selectionChange)="updateSelection($event.selectedIndex)"
>
  <!-- Finished steps show a check, whether or not they can be reopened. -->
  <ng-template matStepperIcon="edit">
    <mat-icon fontSet="material-icons-outlined" aria-hidden="true">check</mat-icon>
  </ng-template>
  <ng-template matStepperIcon="done">
    <mat-icon fontSet="material-icons-outlined" aria-hidden="true">check</mat-icon>
  </ng-template>

  @for (step of steps(); track step.label()) {
    <mat-step
      [editable]="!step.disabled()"
      [label]="step.label()"
      [stepControl]="step.materialStepControl()"
    >
      <ng-container [ngTemplateOutlet]="step.content()" />
    </mat-step>
  }
</mat-stepper>
