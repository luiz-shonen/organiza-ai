# Organiza AI assistant: suggests what is missing on an event's item list.
# Stateless: no KV, no queue, no cron. Firestore (with the caller's own token) keeps the quota.
# Secrets (set by the CD): GEMINI_API_KEY, GROQ_API_KEY. Either one alone is enough.
name = "organizaai-ai"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
APP_ORIGIN = "https://organizaai.web.app"
FIREBASE_PROJECT_ID = "organiza-ai-3416f"
# Tried in this order; the first answer that parses wins. Change here when a model retires.
GEMINI_MODELS = "gemini-flash-lite-latest,gemini-flash-latest"
GROQ_MODELS = "llama-3.3-70b-versatile,llama-3.1-8b-instant"
