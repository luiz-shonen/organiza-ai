

<main class="login">
  <div class="login__header">
    <div class="login__avatar">
      <img src="icons/logo.svg" alt="Organiza AI" style="height: 48px;" />
    </div>
    
    <h1 class="login__title org-gradient-text animated-gradient">
      Pronto para organizar suas festas hoje?
    </h1>
  </div>

  <div class="login__card glass-card">
    

    @if (errorMessage(); as error) {
      <div class="login__error">
        <mat-icon>error</mat-icon>
        {{ error }}
      </div>
    }

    <form id="login-form" [formGroup]="form" (ngSubmit)="submit()" class="login__form" action="#" method="post">
      
      <div class="login__input-group">
        <mat-icon class="login__input-icon">email</mat-icon>
        <input 
          id="username"
          formControlName="email" name="username" type="email" autocomplete="username" required
          class="glass-input login__input"
          placeholder="E-mail" 
        />
      </div>

      <div class="login__input-group">
        <mat-icon class="login__input-icon">lock</mat-icon>
        <input 
          id="password"
          formControlName="password" name="password" [type]="hidePassword() ? 'password' : 'text'" autocomplete="current-password" required
          class="glass-input login__input login__input--password"
          placeholder="Senha" 
        />
        <button 
          type="button" (click)="hidePassword.set(!hidePassword())"
          class="login__visibility-btn"
        >
          <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </div>

      <button 
        type="submit"
        [disabled]="form.invalid || loading()"
        class="btn-primary-org login__submit"
      >
        @if (loading()) {
          <mat-spinner diameter="20" color="accent"></mat-spinner>
        } @else {
          Entrar ou Cadastrar
        }
      </button>

    </form>

    <div class="login__divider">
      <span class="login__divider-text">OU</span>
    </div>

    <button
      type="button"
      [disabled]="loading()"
      (click)="loginWithGoogle()"
      class="login__google"
    >
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="login__google-icon" />
      Entrar com Google
    </button>

  </div>
</main>
