name: CD Pipeline - PR Preview Deploy

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

jobs:
  deploy-preview:
    name: Deploy PR Preview to Firebase Hosting
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Runtime Config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          cat <<EOF > public/runtime-config.js
          globalThis.__organizaAiRuntimeConfig = {
            firebase: {
              apiKey: '${FIREBASE_API_KEY}',
            },
          };
          EOF

      - name: Build Application
        run: npm run build

      - name: Deploy PR Preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORGANIZA_AI_3416F }}
          projectId: organiza-ai-3416f
          target: organizaai
