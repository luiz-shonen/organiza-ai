<table mat-table class="org-data-table" [dataSource]="rows()" [attr.aria-label]="ariaLabel()">
  @for (column of columns(); track column.id) {
    <ng-container [matColumnDef]="column.id">
      <th mat-header-cell *matHeaderCellDef>{{ column.label }}</th>
      <td mat-cell *matCellDef="let row" [attr.aria-label]="column.ariaLabel ?? column.label">
        {{ column.value(row) }}
      </td>
    </ng-container>
  }

  @if (actionTemplate(); as actions) {
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>{{ actionLabel() }}</th>
      <td mat-cell *matCellDef="let row" (click)="$event.stopPropagation()">
        <ng-container [ngTemplateOutlet]="actions" [ngTemplateOutletContext]="{ $implicit: row }" />
      </td>
    </ng-container>
  }

  <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns()" (click)="activate(row)"></tr>
</table>
