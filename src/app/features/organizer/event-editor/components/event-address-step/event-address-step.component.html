@let addressForm = form();
<form
  [formGroup]="addressForm"
  class="event-step"
  id="address-form"
  data-testid="event-editor-step-2"
>
  <org-surface variant="card">
    <div class="event-step__card">
      <org-card-header
        icon="place"
        heading="Endereço do evento"
        subheading="Digite o CEP e completamos o resto"
      />
      <div class="event-step__row event-step__row--halves">
        <org-text-field
          label="CEP"
          placeholder="00000-000"
          [required]="true"
          [maxLength]="9"
          [error]="fieldError(addressForm.controls.cep, 'CEP é obrigatório')"
          formControlName="cep"
          testId="event-cep-input"
          (valueChange)="cepInput.emit($event)"
        />

        <org-text-field
          label="Número"
          placeholder="Ex: 123"
          [required]="true"
          [maxLength]="7"
          [error]="fieldError(addressForm.controls.number, 'Número é obrigatório')"
          formControlName="number"
          testId="event-number-input"
        />
      </div>

      <org-text-field
        class="event-step__locked"
        label="Endereço"
        placeholder="Ex: Rua das Festas"
        [readOnly]="true"
        [required]="true"
        [error]="
          addressForm.controls.address.hasError('required') && addressForm.controls.address.touched
            ? 'Endereço é obrigatório'
            : ''
        "
        formControlName="address"
        testId="event-street-input"
      />

      <div class="event-step__row event-step__row--wide-narrow">
        <org-text-field
          class="event-step__locked"
          label="Bairro"
          placeholder="Ex: Centro"
          [readOnly]="true"
          [required]="true"
          [error]="
            addressForm.controls.neighborhood.hasError('required') &&
            addressForm.controls.neighborhood.touched
              ? 'Bairro é obrigatório'
              : ''
          "
          formControlName="neighborhood"
        />

        <org-text-field
          class="event-step__locked"
          label="Cidade/UF"
          placeholder="Ex: São Paulo/SP"
          [readOnly]="true"
          [required]="true"
          [error]="
            addressForm.controls.city.hasError('required') && addressForm.controls.city.touched
              ? 'Cidade/UF é obrigatória'
              : ''
          "
          formControlName="city"
        />
      </div>
    </div>
  </org-surface>
  <div class="event-step__actions">
    <org-button label="Voltar" variant="text" (pressed)="back.emit()" />
    <org-button
      label="Próximo"
      testId="stepper-next-btn"
      [gradient]="false"
      [disabled]="addressForm.invalid"
      (pressed)="next.emit()"
    />
  </div>
</form>
