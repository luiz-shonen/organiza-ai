<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <radialGradient id="flakeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8E8FF" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <!-- 6-branch crystalline snowflake -->
  <g stroke="url(#flakeGlow)" stroke-width="1.2" stroke-linecap="round" fill="none">
    <!-- Main axes (6 branches at 60° intervals) -->
    <line x1="20" y1="2" x2="20" y2="38"/>
    <line x1="4.4" y1="11" x2="35.6" y2="29"/>
    <line x1="4.4" y1="29" x2="35.6" y2="11"/>

    <!-- Branch details (small chevrons on each arm) -->
    <!-- Top arm -->
    <line x1="20" y1="8" x2="16" y2="5"/>
    <line x1="20" y1="8" x2="24" y2="5"/>
    <!-- Bottom arm -->
    <line x1="20" y1="32" x2="16" y2="35"/>
    <line x1="20" y1="32" x2="24" y2="35"/>
    <!-- Upper-right arm -->
    <line x1="28" y1="14" x2="30" y2="10"/>
    <line x1="28" y1="14" x2="32" y2="16"/>
    <!-- Lower-left arm -->
    <line x1="12" y1="26" x2="10" y2="30"/>
    <line x1="12" y1="26" x2="8" y2="24"/>
    <!-- Upper-left arm -->
    <line x1="12" y1="14" x2="8" y2="16"/>
    <line x1="12" y1="14" x2="10" y2="10"/>
    <!-- Lower-right arm -->
    <line x1="28" y1="26" x2="32" y2="24"/>
    <line x1="28" y1="26" x2="30" y2="30"/>
  </g>

  <!-- Center crystal -->
  <circle cx="20" cy="20" r="2.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
