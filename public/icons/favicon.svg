<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Vibrante do Checkmark -->
    <linearGradient id="partyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D94" />
      <stop offset="50%" stop-color="#FF8C42" />
      <stop offset="100%" stop-color="#FFC837" />
    </linearGradient>

    <!-- Sombra projetada mais forte para o check saltar aos olhos -->
    <filter id="popShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#FF8C42" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    /* Traços bem grossos para legibilidade em 16x16px */
    .doodle {
      stroke: #2D3436;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <!-- ========================================== -->
  <!-- CONFETES (Congelados no momento da explosão)-->
  <!-- ========================================== -->
  <g>
    <!-- Cima Esquerda -->
    <circle cx="45" cy="45" r="10" fill="#FF4D94" />
    <rect x="25" y="80" width="12" height="12" rx="3" fill="#FFC837" transform="rotate(15 31 86)" />
    
    <!-- Cima Direita -->
    <polygon points="150,30 165,45 145,55" fill="#4DEDFF" />
    <circle cx="170" cy="85" r="8" fill="#9B59B6" />
    
    <!-- Baixo Esquerda e Direita -->
    <polygon points="40,150 50,165 30,165" fill="#4DEDFF" transform="rotate(-20 40 157)" />
    <rect x="155" y="145" width="14" height="14" rx="4" fill="#FF8C42" transform="rotate(45 162 152)" />
    <path d="M160,110 Q175,95 185,115" stroke="#FF4D94" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>

  <!-- ========================================== -->
  <!-- ÍCONE CENTRAL (Levemente inclinado)        -->
  <!-- ========================================== -->
  <g transform="translate(100, 105) rotate(-4) translate(-100, -105)">
    <!-- Base branca da agenda -->
    <rect x="45" y="45" width="110" height="120" rx="16" fill="#FFFFFF" class="doodle" />
    
    <!-- Cabeçalho Rosa Festa -->
    <path d="M45,90 L155,90 L155,61 C155,52.16 147.84,45 139,45 L61,45 C52.16,45 45,52.16 45,61 Z" fill="#FF4D94" class="doodle"/>
    
    <!-- Espirais (Mais destacadas) -->
    <rect x="65" y="25" width="12" height="28" rx="6" fill="#2D3436" />
    <rect x="123" y="25" width="12" height="28" rx="6" fill="#2D3436" />

    <!-- Grid simplificado (Apenas dois quadrados para não poluir visualmente) -->
    <rect x="65" y="110" width="28" height="28" rx="6" stroke="#E2E8F0" stroke-width="6" fill="none" />
    <!-- Quadrado de destaque tracejado -->
    <rect x="107" y="110" width="28" height="28" rx="6" stroke="#2D3436" stroke-width="6" stroke-dasharray="6 6" fill="none" />
  </g>

  <!-- ========================================== -->
  <!-- CHECKMARK (A cereja do bolo, saindo do grid)-->
  <!-- ========================================== -->
  <path d="M 85,130 L 105,150 L 165,80" 
        fill="none" 
        stroke="url(#partyGradient)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#popShadow)" />

</svg>
