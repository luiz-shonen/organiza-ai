<section
  class="org-banner"
  [class]="'org-banner org-banner--' + variant()"
  data-testid="org-banner"
  role="alert"
>
  @if (icon(); as icon) {
    <org-icon class="org-banner__icon" [name]="icon" color="currentColor" />
  }
  <!-- A line break in the message starts a new line. -->
  <p class="org-banner__message">{{ message() }}</p>
  @if (actionLabel(); as label) {
    <org-button
      class="org-banner__action org-banner__action--wide"
      variant="text"
      testId="org-banner-action"
      [label]="label"
      [icon]="actionIcon()"
      [compact]="true"
      (pressed)="action.emit()"
    />
    <org-icon-button
      class="org-banner__action org-banner__action--phone"
      testId="org-banner-action-phone"
      variant="primary"
      [icon]="actionIcon() ?? 'undo'"
      [ariaLabel]="label"
      [tooltip]="label"
      (pressed)="action.emit()"
    />
  }
  @if (dismissLabel(); as label) {
    <org-icon-button
      class="org-banner__dismiss"
      icon="close"
      testId="org-banner-dismiss"
      [ariaLabel]="label"
      [tooltip]="label"
      (pressed)="dismissed.emit()"
    />
  }
</section>
