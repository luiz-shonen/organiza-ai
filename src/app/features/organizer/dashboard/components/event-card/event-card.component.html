@if (event(); as ev) {
  <mat-card
    class="org-event-card glass-card"
    [class.org-event-card--cancelled]="ev.status === 'cancelled'"
    appearance="outlined"
    (click)="onCardClick()"
    (keydown.enter)="onCardClick()"
    (keydown.space)="onCardClick()"
    tabindex="0"
    [attr.aria-label]="'Evento ' + ev.title + ', papel: ' + (isOwner() ? 'Organizador' : 'Colaborador')"
  >
    <mat-card-header class="org-event-card__header">
      <div class="org-event-card__title-row">
        <mat-card-title class="org-event-card__title">{{ ev.title }}</mat-card-title>
        <div class="org-event-card__badge-container">
          @if (isOwner()) {
            <span class="org-event-card__role-badge org-event-card__role-badge--owner" role="status" aria-label="Papel: Organizador">
              <mat-icon class="org-event-card__badge-icon" aria-hidden="true">stars</mat-icon>
              Organizador
            </span>
          } @else {
            <span class="org-event-card__role-badge org-event-card__role-badge--collaborator" role="status" aria-label="Papel: Colaborador">
              <mat-icon class="org-event-card__badge-icon" aria-hidden="true">group</mat-icon>
              Colaborador
            </span>
          }
        </div>
      </div>
      <mat-card-subtitle class="org-event-card__subtitle">
        <span class="org-event-card__meta-item">
          <mat-icon class="org-event-card__meta-icon" aria-hidden="true">calendar_today</mat-icon>
          {{ ev.date | date: 'dd/MM/yyyy HH:mm' }}
        </span>
        <span class="org-event-card__meta-item">
          <mat-icon class="org-event-card__meta-icon" aria-hidden="true">location_on</mat-icon>
          {{ ev.location }}
        </span>
      </mat-card-subtitle>
    </mat-card-header>

    @if (ev.description) {
      <mat-card-content class="org-event-card__content">
        <p class="org-event-card__desc">{{ ev.description }}</p>
      </mat-card-content>
    }

    <mat-card-actions class="org-event-card__actions" align="end">
      <button
        mat-icon-button
        type="button"
        (click)="onEdit($event)"
        matTooltip="Editar"
        [attr.aria-label]="'Editar ' + ev.title"
      >
        <mat-icon aria-hidden="true">edit</mat-icon>
      </button>

      <button
        mat-icon-button
        type="button"
        (click)="onShare($event)"
        matTooltip="Compartilhar no WhatsApp"
        [attr.aria-label]="'Compartilhar ' + ev.title + ' no WhatsApp'"
      >
        <mat-icon aria-hidden="true">share</mat-icon>
      </button>

      <button
        mat-icon-button
        type="button"
        (click)="onCopyLink($event)"
        matTooltip="Copiar Link"
        [attr.aria-label]="'Copiar link de ' + ev.title"
      >
        <mat-icon aria-hidden="true">link</mat-icon>
      </button>

      @if (isOwner()) {
        <button
          mat-icon-button
          color="warn"
          type="button"
          (click)="onCancel($event)"
          matTooltip="Cancelar"
          [attr.aria-label]="'Cancelar ' + ev.title"
        >
          <mat-icon aria-hidden="true">block</mat-icon>
        </button>
      }
    </mat-card-actions>
  </mat-card>
}
