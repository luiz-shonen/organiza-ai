@if (loading()) {
  <org-page-layout maxWidth="narrow">
    <div class="event-detail__loading" aria-hidden="true">
      <org-skeleton class="event-detail__skeleton-hero" />
      <org-skeleton class="event-detail__skeleton-card" />
      <org-skeleton class="event-detail__skeleton-card" />
    </div>
  </org-page-layout>
} @else if (event(); as event) {
  <org-page-layout maxWidth="narrow" data-testid="event-detail-page">
    <div class="event-detail__stack" data-testid="event-detail">
      <app-event-card
        [event]="event"
        [guestCount]="guestCount()"
        [isOwner]="isOwner()"
        [viewerName]="currentGuestName()"
        [canEdit]="canEditEvent()"
        (edit)="editEvent()"
      />

      <!-- The organizer hosts the event; there is no presence for them to confirm. -->
      @if (!isOwner()) {
        <app-rsvp-card
          [isConfirmed]="isUserConfirmed()"
          [pendingApproval]="isUserPending()"
          [isDeclined]="isDeclined()"
          [canDecline]="!!memberUid()"
          [bringsSomething]="checklist().length > 0"
          [hasItems]="progress().length > 0"
          [guestCount]="guestCount()"
          [isLoading]="rsvpLoading()"
          [guestName]="currentGuestName()"
          [secretSanta]="mySecretSanta()"
          [phone]="myPhone()"
          (confirmRsvp)="onConfirmRsvp()"
          (editRsvp)="onEditRsvp()"
          (cancelRsvp)="onCancelRsvp($event)"
          (declineRsvp)="onDeclineRsvp($event)"
          (joinSanta)="onJoinSecretSantaOnly($event)"
          (leaveSanta)="onLeaveSecretSanta()"
        />
      }

      @if (secretSantaNotice(); as notice) {
        <app-notification-card
          data-testid="event-secret-santa-notice"
          readNote="Você já abriu seu resultado do amigo oculto. Se não anotou o nome, peça um novo link para quem organiza o evento."
          [notification]="notice"
          [dismissible]="false"
          (opened)="openSecretSantaNotice($event)"
        />
      }

      @if (checklist().length) {
        <app-family-checklist-card
          [rows]="checklist()"
          (boughtToggle)="onToggleBought($event)"
          (removeRow)="onRemoveClaim($event)"
        />
      }

      <!-- An event with nothing to bring shows no list to guests; organizers still see it. -->
      @if (progress().length || canEdit()) {
        <app-item-list-card [progress]="progress()" (claim)="onClaimItemById($event)" />
      }

      <app-guest-list-card
        class="print-section"
        [households]="households()"
        [forOrganizer]="canEdit()"
        [declines]="declines()"
        [pending]="pendingGuests()"
        [busyGuestId]="approvingGuestId()"
        (approve)="onApproveGuest($event)"
        (refuse)="onRefuseGuest($event)"
        (exportCsv)="exportGuests()"
        (print)="printGuests()"
      />

      @if (showSecretSanta()) {
        <app-secret-santa-card
          [participants]="secretSantaParticipants()"
          [isOwner]="isOwner()"
          [drawnAt]="secretSantaDraw()?.drawnAt ?? null"
          [links]="secretSantaLinks()"
          [outdated]="secretSantaOutdated()"
          [drawing]="secretSantaDrawing()"
          [resendingId]="secretSantaResendingId()"
          [canEditParticipants]="canEditEvent()"
          [selfJoinOpen]="secretSantaSelfJoinOpen()"
          [duplicates]="secretSantaDoubtful()"
          [busyDuplicateId]="secretSantaBusyDuplicate()"
          (selfJoinChange)="onSecretSantaSelfJoin($event)"
          (merge)="onMergeSecretSanta($event)"
          (distinct)="onDistinctSecretSanta($event)"
          (draw)="onDrawSecretSanta()"
          (send)="onSendSecretSanta($event)"
          (resend)="onResendSecretSanta($event)"
          (editParticipants)="onEditSecretSanta()"
        />
      }

      @if (event.pixKey) {
        <app-pix-card
          [pixKey]="event.pixKey"
          [pixType]="event.pixType"
          [estimatedBudget]="event.estimatedBudget ?? null"
          [guestCount]="guestCount()"
        />
      }
    </div>

    <app-claim-sheet
      [entry]="claimingEntry()"
      [people]="claimPeople()"
      [saving]="claimSaving()"
      (confirm)="onConfirmClaim($event)"
      (closed)="closeClaimSheet()"
    />
  </org-page-layout>
} @else {
  <org-page-layout maxWidth="narrow">
    <org-empty-state
      icon="event"
      title="Evento não encontrado"
      description="O evento que você procura não existe ou foi removido."
    />
  </org-page-layout>
}
