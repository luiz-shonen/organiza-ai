<form novalidate class="santa-form" (submit)="$event.preventDefault(); submit()">
  <div class="santa-form__fields">
    @if (lockName()) {
      <!-- A name from a profile is shown, never typed: the profile is where it changes. -->
      <div class="santa-form__name" [attr.data-testid]="testIdPrefix() + '-name'">
        <p class="santa-form__name-text">{{ name() }}</p>
        @if (phoneFromProfile()) {
          <p class="santa-form__name-phone" [attr.data-testid]="testIdPrefix() + '-phone'">
            {{ phone() }}
          </p>
        }
      </div>
    } @else {
      <org-text-field
        label="Nome"
        placeholder="Ex: Jéssica"
        [testId]="testIdPrefix() + '-name-input'"
        [required]="true"
        [maxLength]="nameMaxLength"
        [error]="nameError()"
        [suggestions]="nameSuggestions()"
        [(value)]="name"
        (suggestionPicked)="pickPerson($event)"
      />
    }
    <!-- A phone from the profile is shown above; the field only asks for a missing one. -->
    @if (!phoneFromProfile()) {
      <org-text-field
        label="Telefone (WhatsApp)"
        type="tel"
        inputMode="numeric"
        placeholder="(11) 98888-1111"
        [hint]="lockName() ? '' : 'Para enviar o link do sorteio.'"
        [testId]="testIdPrefix() + '-phone-input'"
        [mask]="maskPhone"
        [error]="phoneError()"
        [(value)]="phone"
      />
    }
  </div>

  @if (showGiftOptions()) {
    <app-gift-options-field
      [testIdPrefix]="testIdPrefix()"
      [max]="maxGiftOptions()"
      [hint]="giftHint()"
      [(gifts)]="gifts"
    />
  }

  <div class="santa-form__actions">
    @if (cancelLabel(); as cancelLabel) {
      <org-button
        variant="text"
        [label]="cancelLabel"
        [testId]="testIdPrefix() + '-cancel-btn'"
        (pressed)="cancelled.emit()"
      />
    }
    <org-button
      type="submit"
      [class.santa-form__submit--full]="!cancelLabel()"
      [variant]="cancelLabel() ? 'primary' : 'secondary'"
      [gradient]="false"
      [label]="submitLabel()"
      [loading]="saving()"
      [fullWidth]="!cancelLabel()"
      [testId]="testIdPrefix() + '-submit-btn'"
    />
  </div>
</form>
