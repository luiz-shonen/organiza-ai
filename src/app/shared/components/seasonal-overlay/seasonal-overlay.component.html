@let theme = config().activeTheme;

@if (theme !== 'default') {
  <aside class="seasonal-overlay" [attr.data-theme]="theme" aria-hidden="true">
    @switch (theme) {
      @case ('junina') {
        <div class="seasonal-overlay__junina">
          <!-- Horizontal Garland (Bandeirolas) -->
          <div
            class="seasonal-overlay__garland"
            aria-hidden="true"
          ></div>

          <!-- Balão Junino (left) -->
          <img
            class="seasonal-overlay__lantern seasonal-overlay__lantern--left"
            src="seasonal/junina-lantern.svg"
            alt=""
            role="presentation"
          />

          <!-- Balão Junino (right) -->
          <img
            class="seasonal-overlay__lantern seasonal-overlay__lantern--right"
            src="seasonal/junina-lantern.svg"
            alt=""
            role="presentation"
          />

          <!-- Fogueira (left bonfire) -->
          <img
            class="seasonal-overlay__bonfire seasonal-overlay__bonfire--left"
            src="seasonal/junina-bonfire.svg"
            alt=""
            role="presentation"
          />

          <!-- Fogueira (right bonfire, mirrored) -->
          <img
            class="seasonal-overlay__bonfire seasonal-overlay__bonfire--right"
            src="seasonal/junina-bonfire.svg"
            alt=""
            role="presentation"
          />

          <!-- Fogos de artifício -->
          <img
            class="seasonal-overlay__firework seasonal-overlay__firework--1"
            src="seasonal/junina-fireworks.svg"
            alt=""
            role="presentation"
          />
          <img
            class="seasonal-overlay__firework seasonal-overlay__firework--2"
            src="seasonal/junina-fireworks.svg"
            alt=""
            role="presentation"
          />
          <img
            class="seasonal-overlay__firework seasonal-overlay__firework--3"
            src="seasonal/junina-fireworks.svg"
            alt=""
            role="presentation"
          />
        </div>
      }

      @case ('natal') {
        <div class="seasonal-overlay__natal">
          <!-- Sunrise-like divine light background -->
          <div class="seasonal-overlay__divine-light"></div>

          <!-- Estrela de Belém (top right, pulsating) -->
          <img
            class="seasonal-overlay__star"
            src="seasonal/natal-star.svg"
            alt=""
            role="presentation"
          />

          <!-- Light beam descending from the star -->
          <div class="seasonal-overlay__star-beam"></div>

          <!-- Falling snowflakes -->
          <div class="seasonal-overlay__snow">
            <img class="seasonal-overlay__snowflake seasonal-overlay__snowflake--1" src="seasonal/natal-snowflake.svg" alt="" role="presentation" />
            <img class="seasonal-overlay__snowflake seasonal-overlay__snowflake--2" src="seasonal/natal-snowflake.svg" alt="" role="presentation" />
            <img class="seasonal-overlay__snowflake seasonal-overlay__snowflake--3" src="seasonal/natal-snowflake.svg" alt="" role="presentation" />
            <img class="seasonal-overlay__snowflake seasonal-overlay__snowflake--4" src="seasonal/natal-snowflake.svg" alt="" role="presentation" />
            <img class="seasonal-overlay__snowflake seasonal-overlay__snowflake--5" src="seasonal/natal-snowflake.svg" alt="" role="presentation" />
            <img class="seasonal-overlay__snowflake seasonal-overlay__snowflake--6" src="seasonal/natal-snowflake.svg" alt="" role="presentation" />
            <img class="seasonal-overlay__snowflake seasonal-overlay__snowflake--7" src="seasonal/natal-snowflake.svg" alt="" role="presentation" />
            <img class="seasonal-overlay__snowflake seasonal-overlay__snowflake--8" src="seasonal/natal-snowflake.svg" alt="" role="presentation" />
          </div>

          <!-- Silhueta de Belém (bottom) -->
          <img
            class="seasonal-overlay__bethlehem"
            src="seasonal/natal-bethlehem.svg"
            alt=""
            role="presentation"
          />
        </div>
      }

      @case ('pascoa') {
        <div class="seasonal-overlay__pascoa">
          <!-- Dawn rays background -->
          <img
            class="seasonal-overlay__dawn-rays"
            src="seasonal/pascoa-rays.svg"
            alt=""
            role="presentation"
          />

          <!-- Empty Cross (symbol of resurrection) -->
          <img
            class="seasonal-overlay__cross"
            src="seasonal/pascoa-cross.svg"
            alt=""
            role="presentation"
          />

          <!-- Ascending golden particles -->
          <div class="seasonal-overlay__ascend-particles">
            <span class="seasonal-overlay__particle seasonal-overlay__particle--1"></span>
            <span class="seasonal-overlay__particle seasonal-overlay__particle--2"></span>
            <span class="seasonal-overlay__particle seasonal-overlay__particle--3"></span>
            <span class="seasonal-overlay__particle seasonal-overlay__particle--4"></span>
            <span class="seasonal-overlay__particle seasonal-overlay__particle--5"></span>
            <span class="seasonal-overlay__particle seasonal-overlay__particle--6"></span>
            <span class="seasonal-overlay__particle seasonal-overlay__particle--7"></span>
            <span class="seasonal-overlay__particle seasonal-overlay__particle--8"></span>
          </div>
        </div>
      }

      @case ('ano-novo') {
        <div class="seasonal-overlay__ano-novo">
          <!-- Multiple firework bursts -->
          <img
            class="seasonal-overlay__firework seasonal-overlay__firework--ny1"
            src="seasonal/junina-fireworks.svg"
            alt=""
            role="presentation"
          />
          <img
            class="seasonal-overlay__firework seasonal-overlay__firework--ny2"
            src="seasonal/junina-fireworks.svg"
            alt=""
            role="presentation"
          />
          <img
            class="seasonal-overlay__firework seasonal-overlay__firework--ny3"
            src="seasonal/junina-fireworks.svg"
            alt=""
            role="presentation"
          />
          <img
            class="seasonal-overlay__firework seasonal-overlay__firework--ny4"
            src="seasonal/junina-fireworks.svg"
            alt=""
            role="presentation"
          />
          <img
            class="seasonal-overlay__firework seasonal-overlay__firework--ny5"
            src="seasonal/junina-fireworks.svg"
            alt=""
            role="presentation"
          />
        </div>
      }
    }
  </aside>
}
