    <div class="px-6 mt-8">
      <h2 class="font-headline-md text-2xl font-bold mb-4 org-gradient-text">
        Você vai?
      </h2>
      
      <div class="glass-card rounded-2xl p-6">
        <!-- Optional Tabs (Visual only for now, could control a 'plus ones' input) -->
        <div class="flex p-1 bg-surface-container-low rounded-lg mb-6" style="background-color: rgba(255,255,255,0.4);">
          <button
            class="flex-1 py-2 rounded-md bg-white shadow-sm font-label-sm text-sm font-bold text-on-surface text-center"
          >
            Somente Eu
          </button>
          <button
            class="flex-1 py-2 rounded-md font-label-sm text-sm text-on-surface-variant text-center hover:bg-white/50 transition-colors"
          >
            Com Família
          </button>
        </div>

        <form #f="ngForm" (ngSubmit)="onSubmit(f)" class="flex flex-col gap-4">
          
          <div class="relative">
            <mat-icon class="absolute left-3 top-3 text-on-surface-variant">person</mat-icon>
            <input 
              name="name" ngModel required 
              class="w-full glass-input rounded-t-lg pl-10 pr-4 py-3 font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0"
              placeholder="Nome completo (Ex: João da Silva)" 
            />
          </div>

          <div class="relative mb-2">
            <mat-icon class="absolute left-3 top-3 text-on-surface-variant">phone</mat-icon>
            <input 
              name="phone" ngModel required 
              class="w-full glass-input rounded-t-lg pl-10 pr-4 py-3 font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0"
              placeholder="WhatsApp (Ex: 11999999999)" 
            />
          </div>

          <!-- Action -->
          <div class="flex gap-4">
            <button 
              type="submit"
              [disabled]="f.invalid || isSubmitting()"
              class="flex-1 btn-primary-org rounded-full py-3 font-bold text-white flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
            >
              @if (isSubmitting()) {
                <mat-spinner diameter="20" color="accent"></mat-spinner>
              } @else {
                Confirmar Presença
              }
            </button>
          </div>
        </form>
      </div>
    </div>
