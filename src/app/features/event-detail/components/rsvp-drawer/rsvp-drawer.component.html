<section
  class="rsvp-drawer"
  data-testid="rsvp-drawer"
  role="dialog"
  aria-modal="true"
  aria-labelledby="rsvp-drawer-title"
>
  <header class="rsvp-drawer__header">
    <div>
      <h2 id="rsvp-drawer-title" class="rsvp-drawer__title">
        {{ editing() ? 'Editar presença' : 'Confirme seus dados' }}
      </h2>
      <p class="rsvp-drawer__description">
        {{
          editing()
            ? 'Mude acompanhantes, familiares ou seu telefone.'
            : 'Sua presença principal permanece vinculada à sua conta verificada.'
        }}
      </p>
    </div>
    <org-icon-button
      ariaLabel="Fechar confirmação"
      icon="close"
      data-testid="rsvp-close-btn"
      (pressed)="closeDrawer()"
    />
  </header>

  <form [formGroup]="form" class="rsvp-drawer__form" id="rsvp-form">
    <div class="rsvp-drawer__content">
      <div class="rsvp-drawer__guest" data-testid="rsvp-guest-name">
        <span class="rsvp-drawer__guest-label">Confirmando como</span>
        <strong class="rsvp-drawer__guest-name">{{ guestName() }}</strong>
        <span class="rsvp-drawer__guest-hint">O nome vem do seu perfil.</span>
      </div>

      <org-text-field
        class="rsvp-drawer__field"
        label="WhatsApp / Telefone"
        type="tel"
        formControlName="phone"
        placeholder="(11) 99999-9999"
        [required]="true"
        [mask]="maskPhone"
        hint="Mudar aqui também muda no seu perfil."
        testId="rsvp-phone-input"
        [error]="fieldError(form.controls.phone, 'Telefone é obrigatório')"
      />

      <app-companion-selector
        class="rsvp-drawer__companions"
        [names]="companionNames()"
        [selected]="selectedCompanions()"
        (toggleCompanion)="onToggleCompanion($event)"
        (add)="onAddCompanion($event)"
      />

      <div class="rsvp-drawer__family" data-testid="family-selector">
        <app-family-selector
          [members]="familyMembers()"
          [selectedIds]="selectedFamilyMemberIds()"
          [isAddingInline]="isAddingInline()"
          (toggleMember)="onToggleFamilyMember($event)"
          (selectAll)="onSelectAllFamily($event)"
          (addInlineMember)="onAddInlineFamilyMember($event)"
        />
      </div>
    </div>

    <footer class="rsvp-drawer__actions">
      <org-button
        label="Cancelar"
        variant="secondary"
        [gradient]="false"
        data-testid="rsvp-cancel-btn"
        (pressed)="closeDrawer()"
      />
      <org-button
        [label]="editing() ? 'Salvar' : 'Confirmar'"
        data-testid="rsvp-confirm-btn"
        (pressed)="submit()"
      />
    </footer>
  </form>
</section>
