@if (event(); as ev) {
  <article class="event-card">
    <!-- Hero Image Container -->
    <div class="event-card__hero">
      <div class="event-card__hero-fallback"></div>
      <img
        alt=""
        class="event-card__hero-img"
        loading="eager"
        src="https://images.unsplash.com/photo-1533174000273-e18f142b4d99?auto=format&fit=crop&w=1200&q=80"
        onerror="this.style.display='none'"
      />
      <div class="event-card__hero-overlay"></div>

      <div class="event-card__hero-info">
        <span class="event-card__category-badge">
          Festa & Celebração
        </span>
        <h1 class="event-card__title">
          {{ ev.title }}
        </h1>
      </div>
    </div>

    <!-- Main Glass Card -->
    <div class="event-card__details-wrapper">
      <div class="glass-card event-card__details-card">
        <!-- Date & Time -->
        <div class="event-card__detail-row">
          <div class="event-card__date-badge">
            <span class="event-card__date-month">{{ ev.date | date: 'MMM' }}</span>
            <span class="event-card__date-day">{{ ev.date | date: 'dd' }}</span>
          </div>
          <div class="event-card__date-text">
            <p class="event-card__date-full">{{ (ev.date | date: 'EEEE, HH:mm') | titlecase }}</p>
            <a class="event-card__date-sub" [href]="googleCalendarUrl()" target="_blank" rel="noopener noreferrer">Adicionar ao calendário</a>
          </div>
        </div>

        <hr class="event-card__divider" />

        <!-- Location -->
        <a
          class="event-card__detail-row event-card__detail-row--link"
          [href]="'https://www.google.com/maps/search/?api=1&query=' + ev.location"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="event-card__location-icon-badge">
            <mat-icon>location_on</mat-icon>
          </div>
          <div class="event-card__location-text">
            <p class="event-card__location-title">{{ ev.location }}</p>
            <p class="event-card__location-desc">{{ ev.description }}</p>
          </div>
        </a>
      </div>
    </div>

    <!-- Hosted By -->
    <div class="event-card__host-section">
      <p class="event-card__host-label">Organizado Por</p>
      <div class="event-card__host-info">
        <div class="event-card__host-avatar">
          <mat-icon>person</mat-icon>
        </div>
        <div class="event-card__host-details">
          <p class="event-card__host-name">Você (Admin)</p>
          <p class="event-card__host-sub">Organiza AI</p>
        </div>
      </div>
    </div>
  </article>
}
