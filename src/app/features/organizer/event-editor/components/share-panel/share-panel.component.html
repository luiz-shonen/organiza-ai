@if (eventUrl()) {
  <org-surface variant="card">
    <article class="share-panel">
      <header class="share-panel__header">
        <mat-icon class="share-panel__icon" aria-hidden="true">qr_code_2</mat-icon>
        <div>
          <h2 class="share-panel__title">Compartilhar</h2>
          <p class="share-panel__subtitle">Convide seus amigos!</p>
        </div>
      </header>
      <div class="share-panel__qr-container">
        <canvas #qrCanvas class="share-panel__qr" aria-label="QR Code do evento"></canvas>
      </div>

      <div class="share-panel__link">
        <code class="share-panel__url">{{ eventUrl() }}</code>
      </div>
      <footer class="share-panel__actions">
        <org-button
          label="Copiar link"
          icon="content_copy"
          variant="secondary"
          [gradient]="false"
          (pressed)="copyLink()"
        />
        <org-button
          label="WhatsApp"
          icon="share"
          [gradient]="false"
          class="share-panel__whatsapp-btn"
          (pressed)="shareWhatsApp()"
        />
      </footer>
    </article>
  </org-surface>
}
