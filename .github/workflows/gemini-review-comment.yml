name: Gemini PR Review (On Demand)

on:
  issue_comment:
    types: [created]

jobs:
  comment-review:
    name: On-Demand Gemini Review
    # Only people with write access may trigger it: the job checks out the PR head
    # and runs it with GEMINI_API_KEY, so a fork author must never be able to start it.
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/review') || contains(github.event.comment.body, '/gemini review'))
    # GEMINI_MODEL + four fallbacks, a 4 min cap per call, 90s of waits: under ~22 min.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      STATUS_CONTEXT: Gemini Review (/review)

    steps:
      # 👀 on the /review comment shows right away that the run was picked up.
      - name: Acknowledge the Comment
        continue-on-error: true
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes --silent

      - name: Fetch PR Metadata
        id: pr-meta
        # Runs before checkout, so gh needs the repository explicitly.
        run: |
          PR_DATA=$(gh pr view ${{ github.event.issue.number }} --repo "${{ github.repository }}" --json baseRefOid,headRefOid)
          echo "base_sha=$(echo "$PR_DATA" | jq -r .baseRefOid)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(echo "$PR_DATA" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"

      # issue_comment runs are not listed in the PR checks, so a commit status on the
      # head commit puts the review there, with a "Details" link to this run.
      - name: Mark Review as Running on the PR
        continue-on-error: true
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr-meta.outputs.head_sha }}" --silent \
            -f state=pending -f context="$STATUS_CONTEXT" -f target_url="$RUN_URL" \
            -f description="Revisão do Gemini em andamento"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr-meta.outputs.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          BASE_SHA: ${{ steps.pr-meta.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr-meta.outputs.head_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IS_ON_DEMAND: 'true'
        run: node scripts/gemini-pr-review.mjs

      - name: Report Failure on the PR
        if: failure() || cancelled()
        run: |
          gh pr comment ${{ github.event.issue.number }} --repo "${{ github.repository }}" \
            --body "⚠️ A revisão sob demanda do Gemini falhou. Veja o log em $RUN_URL"

      - name: Mark Review as Finished on the PR
        if: always() && steps.pr-meta.outputs.head_sha != ''
        env:
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          if [ "$STATE" = success ]; then DESC="Revisão do Gemini publicada"; else DESC="Revisão do Gemini falhou"; fi
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr-meta.outputs.head_sha }}" --silent \
            -f state="$STATE" -f context="$STATUS_CONTEXT" -f target_url="$RUN_URL" -f description="$DESC"
