@if (loading()) {
  <org-page-layout maxWidth="default">
    <div class="event-detail__loading" aria-hidden="true">
      <div class="skeleton-box event-detail__skeleton-hero"></div>
      <div class="skeleton-box event-detail__skeleton-card"></div>
      <div class="skeleton-box event-detail__skeleton-card"></div>
    </div>
  </org-page-layout>
} @else if (event(); as event) {
  <org-page-layout maxWidth="default" data-testid="event-detail-page">
    <app-event-card [event]="event" [guestCount]="guestCount()" />

    <section class="event-detail__section" aria-label="Confirmação de presença">
      <app-rsvp-card
        [isConfirmed]="isUserConfirmed()"
        [guestCount]="guestCount()"
        [isLoading]="rsvpLoading()"
        [guestName]="currentGuestName()"
        (confirmRsvp)="onConfirmRsvp()"
        (cancelRsvp)="onCancelRsvp()"
      />
    </section>

    <app-item-list-card
      [items]="items()"
      [currentUserId]="currentUserId()"
      (claim)="onClaimItemById($event)"
      (unclaim)="onUnclaimItemById($event)"
    />

    @if (event.pixKey) {
      <section class="event-detail__section" aria-label="Contribuição financeira">
        <h2 class="event-detail__section-title org-gradient-text">Contribuição</h2>
        <app-pix-card
          [pixKey]="event.pixKey"
          [pixType]="event.pixType"
          [estimatedBudget]="event.estimatedBudget ?? null"
          [guestCount]="guestCount()"
          (copyPix)="onPixCopied()"
        />
      </section>
    }
  </org-page-layout>
} @else {
  <org-page-layout maxWidth="default">
    <org-empty-state
      icon="event"
      title="Evento não encontrado"
      description="O evento que você procura não existe ou foi removido."
    />
  </org-page-layout>
}
