<org-bottom-sheet
  ariaLabel="Eu levo"
  testId="claim-sheet"
  [open]="!!entry()"
  (closed)="closed.emit()"
>
  @if (entry(); as entry) {
    <header class="claim-sheet__header">
      <p class="claim-sheet__name">
        {{ entry.item.name }}
        <span class="claim-sheet__total">{{ total(entry) }}</span>
      </p>
      <org-badge
        variant="primary"
        [pill]="true"
        [gradient]="false"
        [label]="'Faltam ' + remainingLabel()"
      />
    </header>

    @if (fixed()) {
      <p class="claim-sheet__fixed">
        <org-icon name="info" size="sm" color="currentColor" />
        Quantidade fixa: vocês levam {{ total(entry) }}.
      </p>
    } @else {
      <div class="claim-sheet__group">
        <p class="claim-sheet__question">Quantos vocês vão levar?</p>
        <org-quantity-stepper
          [(value)]="quantity"
          [min]="1"
          [max]="entry.remaining"
          [unit]="unitFor(quantity(), entry.item.unit) || null"
        />
      </div>
    }

    @if (people().length > 1) {
      <div class="claim-sheet__group">
        <p class="claim-sheet__question">Quem da família vai levar?</p>
        <div class="claim-sheet__people" role="radiogroup" aria-label="Quem da família vai levar">
          @for (person of people(); track person.id) {
            <org-chip
              variant="primary"
              [label]="person.name"
              [selectable]="true"
              [gradient]="false"
              [selected]="who() === person.id"
              [testId]="'claim-who-' + (person.id ?? 'me')"
              (selectionChange)="who.set(person.id)"
            />
          }
        </div>
      </div>
    }

    <footer class="claim-sheet__actions">
      <org-button label="Cancelar" variant="text" [fullWidth]="true" (pressed)="closed.emit()" />
      <org-button
        label="Confirmar"
        testId="claim-confirm-btn"
        [fullWidth]="true"
        [gradient]="false"
        [loading]="saving()"
        (pressed)="submit()"
      />
    </footer>
  }
</org-bottom-sheet>
