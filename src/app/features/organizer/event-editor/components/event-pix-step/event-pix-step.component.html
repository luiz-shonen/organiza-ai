<form [formGroup]="form()" class="event-step" id="pix-form" data-testid="event-editor-step-4">
  <org-surface variant="card">
    <div class="event-step__card">
      <org-card-header
        icon="pix"
        heading="Pagamento por Pix"
        subheading="Para rachar os custos com os convidados"
      />
      <org-text-field
        label="Chave Pix (opcional)"
        placeholder="CPF, e-mail ou chave aleatória"
        hint="Deixe em branco se não quiser rachadinha."
        formControlName="pixKey"
        testId="event-pix-input"
      />
    </div>
  </org-surface>
  <div class="event-step__actions">
    <org-button label="Voltar" variant="text" (pressed)="back.emit()" />
    @if (canSave()) {
      <org-button
        testId="event-save-btn"
        [label]="isEditing() ? 'Salvar alterações' : 'Criar evento'"
        [gradient]="false"
        [disabled]="!complete() || saving()"
        [loading]="saving()"
        (pressed)="save.emit()"
      />
    } @else {
      <p class="event-step__locked-note">
        <org-icon name="lock" size="sm" />
        Apenas o organizador principal pode salvar alterações principais.
      </p>
    }
  </div>
</form>
