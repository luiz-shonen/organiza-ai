<org-surface variant="card" data-testid="pix-card">
  <article class="pix-card">
    <org-card-header
      icon="pix"
      heading="Rachadinha via Pix"
      [subheading]="pixType() ? 'Tipo: ' + pixType() : 'Contribua com o evento!'"
    >
      <!-- Copy sits in the header, as in banking apps: the key below is what it copies. -->
      @if (pixKey()) {
        <org-copy-button
          orgCardHeaderAction
          label="Copiar"
          tooltip="Copiar chave Pix"
          variant="tonal"
          copiedMessage="Chave Pix copiada!"
          data-testid="copy-pix-btn"
          [value]="pixKey()"
          [gradient]="false"
          [compact]="true"
        />
      }
    </org-card-header>

    @if (formattedSuggestedSplit(); as split) {
      <div
        class="pix-card__split-container"
        role="status"
        aria-label="Sugestão de contribuição por pessoa"
      >
        <span class="pix-card__split-label">Sugestão de contribuição:</span>
        <span class="pix-card__split-amount">{{ split }} por pessoa</span>
      </div>
    }

    @if (pixKey()) {
      <div class="pix-card__key-container">
        <span class="pix-card__key-label">Chave Pix</span>
        <code class="pix-card__key" aria-label="Chave Pix">{{ pixKey() }}</code>
      </div>
    }
  </article>
</org-surface>
