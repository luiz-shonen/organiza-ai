<mat-form-field appearance="outline" class="org-text-field">
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    [disabled]="disabled() || disabledState"
    [min]="min()"
    [max]="max()"
    [placeholder]="placeholder()"
    [required]="required()"
    [readonly]="readOnly()"
    [type]="type() === 'password' && passwordVisible() ? 'text' : type()"
    [value]="value()"
    [attr.data-testid]="testId() || null"
    (input)="updateValue($event)"
    (blur)="markTouched()"
  />
  @if (prefixIcon(); as prefixIcon) {
    <mat-icon matPrefix aria-hidden="true">{{ prefixIcon }}</mat-icon>
  }
  @if (type() === 'password') {
    <button
      mat-icon-button
      matSuffix
      type="button"
      [attr.aria-label]="passwordVisible() ? 'Ocultar senha' : 'Mostrar senha'"
      (click)="requestPasswordVisibilityToggle()"
    >
      <mat-icon aria-hidden="true">{{
        passwordVisible() ? 'visibility_off' : 'visibility'
      }}</mat-icon>
    </button>
  } @else if (suffixIcon(); as suffixIcon) {
    <mat-icon matSuffix aria-hidden="true">{{ suffixIcon }}</mat-icon>
  }
  @if (hint() && !error()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
</mat-form-field>
@if (error()) {
  <p class="org-text-field__error" role="alert">{{ error() }}</p>
}
